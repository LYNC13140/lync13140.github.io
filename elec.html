<style>
:root{--bg:#0b1428;--card:#16264a;--line:#2a3f6b;--tx:#eef3ff;--mu:#9fb2d6;--ok:#3ccf7a;--bad:#ff6b6b;--warn:#ffc04d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
#app{padding:0 12px calc(20px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:3;background:var(--bg);padding:12px 0 8px;border-bottom:1px solid var(--line)}
.top h1{font-size:19px;margin:0}.mu{color:var(--mu);font-size:13px}
.modo{margin-top:6px;font-size:13px;font-weight:700;padding:6px 10px;border-radius:10px;background:#ffc04d22;border:1px solid #ffc04d66}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.k{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;min-height:96px;position:relative;cursor:pointer}
.k:active{transform:scale(.98)}.k small{display:block;font-size:13px;color:#d6e0f5;padding-right:28px;line-height:1.25}.k i{position:absolute;right:10px;top:10px;font-style:normal;font-size:22px}
.k b{display:block;font-size:30px;margin-top:8px}
.bad b{color:var(--bad)}.ok b{color:var(--ok)}.warn b{color:var(--warn)}
.back{background:none;border:none;color:var(--tx);font-size:16px;padding:8px 0;cursor:pointer}
.it{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:8px}
.it b{font-size:15px}.it .d{font-size:13px;color:#d6e0f5;margin-top:3px}
input{width:100%;font-size:16px;padding:11px;border-radius:12px;border:1px solid var(--line);background:#0f1c38;color:#fff;margin-top:10px}
.av{height:10px;background:#0f1c38;border-radius:6px;overflow:hidden;margin-top:6px}.av div{height:100%;background:var(--ok)}
.osmdark{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9)}.leaflet-control-attribution{font-size:9px;background:rgba(0,0,0,.5)!important;color:#aaa}.leaflet-control-attribution a{color:#9cf}

.ov{position:fixed;inset:0;z-index:2000;background:#050a17;overflow:auto;padding:12px 12px calc(24px + env(safe-area-inset-bottom))}
.bt{display:block;width:100%;min-height:50px;border:0;border-radius:14px;font:800 16px Arial;color:#fff;margin-top:10px;cursor:pointer}
.bt.v{background:linear-gradient(135deg,#15803d,#22c55e)}.bt.g{background:linear-gradient(135deg,#334155,#475569)}.bt.a{background:linear-gradient(135deg,#1d4ed8,#3b82f6)}
.tel{display:inline-block;margin-top:6px;padding:9px 14px;border-radius:12px;background:#1d4ed8;color:#fff;font-weight:800;text-decoration:none;font-size:16px}
.vivo{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:999px;background:#16a34a;color:#fff;font-size:11px;font-weight:800}
.it.tap{cursor:pointer}.it.tap:active{transform:scale(.99)}
.pop-b{margin-top:6px;padding:6px 10px;border:0;border-radius:10px;background:#1d4ed8;color:#fff;font-weight:700;cursor:pointer}
.gcan{transform:translate(-50%,-50%);white-space:nowrap;color:#fff;font-size:11px;font-weight:700;text-shadow:0 0 3px #000,0 0 3px #000;pointer-events:none}.gcan b{color:#ffd400}
.satbox{display:flex;gap:6px;align-items:center;background:rgba(5,10,23,.85);border:1px solid #2a3f6b;border-radius:10px;padding:4px 8px;color:#e9f1ff;font-size:12px}.satbox button{border:0;border-radius:8px;background:#1d4ed8;color:#fff;font-weight:800;padding:4px 8px;cursor:pointer}
.leaflet-container{background:#070d1a}
