<style>
:root{--bg:#0b1428;--card:#16264a;--line:#2a3f6b;--tx:#eef3ff;--mu:#9fb2d6;--ok:#3ccf7a;--bad:#ff6b6b;--warn:#ffc04d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
#app{padding:0 12px calc(20px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:3;background:var(--bg);padding:12px 0 8px;border-bottom:1px solid var(--line)}
.top h1{font-size:19px;margin:0}.mu{color:var(--mu);font-size:13px}
.modo{margin-top:6px;font-size:13px;font-weight:700;padding:6px 10px;border-radius:10px;background:#ffc04d22;border:1px solid #ffc04d66}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.k{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;min-height:96px;position:relative;cursor:pointer}
.k:active{transform:scale(.98)}.k small{display:block;font-size:13px;color:#d6e0f5;padding-right:28px;line-height:1.25}.k i{position:absolute;right:10px;top:10px;font-style:normal;font-size:22px}
.k b{display:block;font-size:30px;margin-top:8px}
.bad b{color:var(--bad)}.ok b{color:var(--ok)}.warn b{color:var(--warn)}
.back{background:none;border:none;color:var(--tx);font-size:16px;padding:8px 0;cursor:pointer}
.it{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:8px}
.it b{font-size:15px}.it .d{font-size:13px;color:#d6e0f5;margin-top:3px}
input{width:100%;font-size:16px;padding:11px;border-radius:12px;border:1px solid var(--line);background:#0f1c38;color:#fff;margin-top:10px}
.av{height:10px;background:#0f1c38;border-radius:6px;overflow:hidden;margin-top:6px}.av div{height:100%;background:var(--ok)}
</style>

function hacer(e,c,big){var i=new Image();i.className='emo'+(big?' emo-g':'');i.alt=e;i.draggable=false;i.decoding='async';
 var fluent=OK.has(c);i.src=fluent?('emo/'+(big?'g/':'')+c+'.webp'):(NOTO+c+'/emoji.svg');
 i.onerror=function(){if(fluent&&!this.dataset.f){this.dataset.f='1';this.src=NOTO+c+'/emoji.svg';return}
  FAIL.add(c);if(this.parentNode)this.parentNode.replaceChild(document.createTextNode(e),this)};
 return i}
function txt(n){var v=n.nodeValue,p=n.parentNode;if(!v||!p||SKIP[p.nodeName]||!HAY.test(v))return;
 if(p.closest&&p.closest('svg,[data-noemo]'))return;
 var big=grande(p),f=document.createDocumentFragment(),last=0,m,hay=false;RE.lastIndex=0;
 while((m=RE.exec(v))){var e=m[0],c=cod(e);if(MAL.test(e)||FAIL.has(c))continue;
  if(m.index>last)f.appendChild(document.createTextNode(v.slice(last,m.index)));f.appendChild(hacer(e,c,big));last=m.index+e.length;hay=true}
 if(!hay)return;if(last<v.length)f.appendChild(document.createTextNode(v.slice(last)));p.replaceChild(f,n)}
function scan(r){if(!r)return;if(r.nodeType===3)return txt(r);if(r.nodeType!==1||SKIP[r.nodeName])return;
 var w=document.createTreeWalker(r,NodeFilter.SHOW_TEXT),a=[];while(w.nextNode())a.push(w.currentNode);a.forEach(txt)}
function ini(){scan(document.body);new MutationObserver(function(ms){ms.forEach(function(m){if(m.type==='characterData')txt(m.target);else m.addedNodes.forEach(scan)})})
 .observe(document.body,{childList:true,subtree:true,characterData:true})}
if(document.body)ini();else document.addEventListener('DOMContentLoaded',ini)})();
</script>
<script id="fondo-fotos">
/* Fondo con fotos de Guayaquil: SOLO aspecto. No toca ningún elemento ni lógica de la página; si algo falla, no se ve nada. */
(function(){try{
var N=20,K='fxFotoUlt',T=40000,doc=document;
function u(n){return 'fondos/'+(n<10?'0':'')+n+'.webp'}
var ult=0;try{ult=+localStorage.getItem(K)||0}catch(e){}
function otra(x){var n;do{n=1+Math.floor(Math.random()*N)}while(n===x);return n}
var act=otra(ult);try{localStorage.setItem(K,act)}catch(e){}
var w=doc.createElement('div');w.id='fx-fotos';w.setAttribute('aria-hidden','true');
var a=doc.createElement('div'),b=doc.createElement('div'),o=doc.createElement('div');
a.className='fx-f';b.className='fx-f';o.className='fx-ov';
w.appendChild(a);w.appendChild(b);w.appendChild(o);
var arr=[a,b],i=0;
function carga(n,ok){var im=new Image();im.onload=function(){ok(im)};im.onerror=function(){};im.src=u(n)}
carga(act,function(){
 a.style.backgroundImage='url("'+u(act)+'")';a.className='fx-f on';
 doc.body.appendChild(w);doc.documentElement.classList.add('fx-fotos');
 var rm=false;try{rm=matchMedia('(prefers-reduced-motion:reduce)').matches}catch(e){}
 if(rm)return;
 setInterval(function(){try{
  if(doc.hidden)return;
  var n=otra(act);
  carga(n,function(){
   var d=arr[1-i];d.style.backgroundImage='url("'+u(n)+'")';
   d.className='fx-f on';arr[i].className='fx-f';i=1-i;act=n;
   try{localStorage.setItem(K,n)}catch(e){}
  });
 }catch(e){}},T);
});
}catch(e){}})();
</script>
