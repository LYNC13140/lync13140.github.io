<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Panel del supervisor</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--fondo:#fff8ec;--azul:#123a6b;--txt:#1b2333;--mut:#5a6577;--verde:#2e9e5b;--rojo:#d64545;--ambar:#e39a19;--celeste:#2f80ed;--gris:#e2d6c0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--fondo);color:var(--txt);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
#app{min-height:100vh;padding:0 0 calc(18px + env(safe-area-inset-bottom))}
.top{background:var(--azul);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:2}
.top .atras{font-size:26px;background:none;border:0;color:#fff;padding:0 6px 0 0}
.top b{font-size:18px;line-height:1.2;display:block}.top small{font-size:13px;opacity:.85}
.q{text-align:center;padding:12px 16px 4px}.q .e{font-size:66px;line-height:1.1}.q h1{font-size:25px;line-height:1.15;color:var(--azul);margin:8px 0 4px}.q p{font-size:16px;color:var(--mut);margin:0}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:10px 14px}
.k{background:#fff;border:3px solid var(--gris);border-radius:16px;padding:9px 6px;text-align:center}.k b{font-size:28px;display:block;color:var(--azul)}.k span{font-size:14px;color:var(--mut);font-weight:700}
.k.v{border-color:#9fd8b6;background:#eaf8ef}.k.v b{color:var(--verde)}.k.r{border-color:#f0b0b0;background:#fdeeee}.k.r b{color:var(--rojo)}.k.a{border-color:#f1d08a;background:#fff6df}.k.a b{color:#b87700}
.ops{padding:6px 14px 0}
.op{display:block;width:100%;border:0;border-radius:20px;padding:17px 12px;margin:0 0 12px;color:#fff;font-size:21px;font-weight:800;line-height:1.2;box-shadow:0 5px 0 rgba(0,0,0,.2);text-align:center;font-family:inherit;position:relative}
.op:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.op.g{background:var(--verde)}.op.r{background:var(--rojo)}.op.a{background:var(--ambar)}.op.b{background:var(--celeste)}.op.n{background:#5b6b82}
.op.chico{font-size:17px;padding:13px 10px}
.badge{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:#fff;color:var(--rojo);border-radius:14px;padding:2px 11px;font-size:18px}
.fil{display:flex;gap:6px;padding:10px 12px 2px;flex-wrap:wrap}
.fil button{background:#fff;border:2px solid var(--gris);border-radius:14px;padding:7px 11px;font-weight:700;font-size:15px;font-family:inherit;color:var(--txt)}
.fil .on{background:var(--azul);color:#fff;border-color:var(--azul)}
.lista{padding:8px 12px}
.esc{display:block;width:100%;text-align:left;background:#fff;border:0;border-radius:16px;padding:11px 12px;margin-bottom:9px;border-left:9px solid var(--verde);box-shadow:0 2px 0 rgba(0,0,0,.08);font-family:inherit;color:var(--txt)}
.esc.r{border-left-color:var(--rojo)}.esc.a{border-left-color:var(--ambar)}.esc.n{border-left-color:#aab}
.esc b{font-size:16px;color:var(--azul)}.esc .s{font-size:16px;margin-top:4px}.esc .m{font-size:13px;color:var(--mut);margin-top:2px}
.esc input{width:24px;height:24px;vertical-align:middle;margin-right:8px}
.lin{display:flex;gap:10px;padding:7px 16px;font-size:17px;align-items:flex-start}.lin i{font-style:normal;font-size:22px;width:30px;flex:0 0 30px}.lin small{color:var(--mut);display:block;font-size:14px}
h3{margin:14px 16px 4px;color:var(--azul);font-size:17px}
.av{margin:10px 14px 0;padding:12px;border-radius:16px;background:#fdeeee;border:3px dashed #e88;font-size:16px;text-align:center;line-height:1.35}
.av.am{background:#fff3cd;border-color:#e0b84a}.av.ok{background:#eaf8ef;border-color:#9fd8b6}
.av b.t{font-size:19px;display:block}
.fila2{display:flex;gap:8px;padding:8px 14px 0}.fila2 .op{margin:0;font-size:16px;padding:12px 6px}
.seg{display:flex;gap:8px;padding:6px 14px}.seg button{flex:1;padding:15px 0;border-radius:16px;background:#fff;border:3px solid var(--gris);font-size:22px;font-weight:800;color:var(--azul);font-family:inherit}
.seg .on{background:var(--azul);color:#fff;border-color:var(--azul)}
.nota{font-size:14px;color:var(--mut);text-align:center;padding:10px 16px}
.girar{display:inline-block;animation:g 1.2s linear infinite}@keyframes g{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
var tg=window.Telegram&&window.Telegram.WebApp,D=null,F={};
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function vibra(t){try{if(t==='ok')tg.HapticFeedback.notificationOccurred('success');else if(t==='mal')tg.HapticFeedback.notificationOccurred('error');else tg.HapticFeedback.impactOccurred('medium')}catch(e){}}
if(tg){try{tg.ready();tg.expand();if(tg.setHeaderColor)tg.setHeaderColor('#123a6b');if(tg.setBackgroundColor)tg.setBackgroundColor('#fff8ec')}catch(e){}}

function pantalla(o){window.scrollTo(0,0);
  var h=(D&&D.dv?'<div style="background:#e39a19;color:#fff;text-align:center;font-weight:800;padding:6px">🧪 VIENDO COMO '+esc(D.dv).toUpperCase()+'</div>':'')+'<div class="top">'+(o.atras?'<button class="atras" id="bAtras">↩</button>':'')+'<div><b>'+(o.tit||'Supervisor · '+esc(D.g))+'</b><small>'+(o.sub||('Hola, '+esc(D.nm)+' · datos de las '+esc(D.h)+edad()))+'</small></div></div>';
  if(o.e||o.h1)h+='<div class="q">'+(o.e?'<div class="e">'+o.e+'</div>':'')+(o.h1?'<h1>'+o.h1+'</h1>':'')+(o.p?'<p>'+o.p+'</p>':'')+'</div>';
  h+=o.html||'';
  if(o.ops){h+='<div class="ops">';o.ops.forEach(function(b,i){h+='<button class="op '+(b[1]||'b')+(b[3]?' chico':'')+'" data-i="'+i+'">'+b[0]+(b[4]?'<span class="badge">'+b[4]+'</span>':'')+'</button>'});h+='</div>'}
  if(o.nota)h+='<div class="nota">'+o.nota+'</div>';
  $('app').innerHTML=h;
  [].forEach.call(document.querySelectorAll('.op[data-i]'),function(el){el.onclick=function(){vibra();o.ops[+el.dataset.i][2]()}});
  [].forEach.call(document.querySelectorAll('[data-f]'),function(el){el.onclick=function(){vibra();o.fn[el.dataset.f](el)}});
  if(o.atras)$('bAtras').onclick=function(){vibra();o.atras()};
}
function alBot(d){pantalla({e:'📨',h1:'Enviando…',p:'Siga en el chat del bot.'});
  try{if(!tg||!tg.sendData)throw 0;tg.sendData(JSON.stringify(d))}
  catch(e){vibra('mal');pantalla({e:'⚠️',h1:'Ábralo desde el bot',p:'Toque <b>📱 ABRIR MI PANEL</b> en el menú de abajo del chat.'})}}

// 🔁 canal de ida y vuelta: la app NO se cierra (el pedido va a la PC por el servidor de paso y la respuesta vuelve aquí)
function canal(CH,CI,FR,d){
  var id=Math.random().toString(36).slice(2,10)+Date.now().toString(36),t0=Math.floor(Date.now()/1000)-3;
  return fetch(FR+'/'+CH.c,{method:'POST',body:JSON.stringify({chat:CI,k:CH.k,id:id,d:d})}).then(function(r){if(!r.ok)throw new Error('envío');
    return new Promise(function(ok,mal){var n=0;(function mira(){n++;
      fetch(FR+'/'+CH.r+'/json?poll=1&since='+t0).then(function(r){return r.text()}).then(function(tx){var hallado=null;
        tx.split('\n').forEach(function(l){try{var e=JSON.parse(l);if(e.event!=='message')return;
          if(e.title===id&&e.attachment)hallado=fetch(e.attachment.url).then(function(r){return r.json()});
          else{var m=JSON.parse(e.message);if(m.id===id)hallado=Promise.resolve(m)}}catch(x){}});
        if(hallado)return hallado.then(ok,mal);
        if(n>(d.accion==='texto'||d.accion==='cb'||d.accion==='mas'?75:30))return mal(new Error('La PC no respondió (¿está prendida?)'));setTimeout(mira,2000)})
      .catch(function(){if(n>75)return mal(new Error('Sin internet'));setTimeout(mira,2500)})})()})})}

function hacer(d){   // acciones del panel: con canal, se queda en la app y muestra el resultado
  if(!D.ch)return alBot(d);
  pantalla({e:'<span class="girar">⏳</span>',h1:'Enviando…',p:'Su PC lo está haciendo. Unos segundos.'});
  canal(D.ch,D.ci,D.fr,d).then(function(res){vibra(res.ok?'ok':'mal');
    if(res.s&&!res.z){pantalla({e:'👷',h1:'Abriendo la pantalla del operador…'});location.replace('index.html?s='+res.s);return}
    var imgs=(res.imgs||[]).map(function(i){return '<div style="margin:10px 14px 0"><img src="'+esc(i[0])+'" style="width:100%;border-radius:14px;display:block" loading="lazy"><div style="font-size:14px;color:#5a6577;padding:4px 2px">'+esc(i[1])+'</div></div>'}).join('');
    pantalla({e:res.ok?'✅':'⚠️',h1:res.ok?'Listo':'No se pudo',html:'<div class="av '+(res.ok?'ok':'')+'" style="text-align:left;font-size:16px">'+(res.txt||'')+'</div>'+imgs,
      ops:[['🏠 VOLVER AL PANEL','g',function(){if(!res.z)return inicio();cargarZ(res.z,function(d2){if(d2)D=d2;inicio()})}]]})})
  .catch(function(e){vibra('mal');pantalla({e:'📶⚠️',h1:'No llegó la respuesta',p:esc(e.message),ops:[['🔄 INTENTAR OTRA VEZ','b',function(){hacer(d)}],['📨 Mandar por Telegram (se cierra la app)','n',function(){alBot(d)},1],['🏠 Volver','n',inicio,1]]})})}

// ☰ Más opciones: el menú de antes, pero DENTRO de la app (los mensajes y botones del bot salen aquí)
function masOpc(d){if(!D.ch)return alBot({accion:'mas'});
  pantalla({tit:'☰ Más opciones',e:'<span class="girar">⏳</span>',h1:'Un momento…',p:'Su PC lo está preparando.'});
  canal(D.ch,D.ci,D.fr,d).then(function(res){if(res.s&&!res.z){location.replace('index.html?s='+res.s);return}
    if(res.z&&d.accion!=='mas')cargarZ(res.z,function(d2){if(d2)D=d2});
    var B=[],h='';
    (res.msgs||[]).forEach(function(m){h+='<div class="av" style="text-align:left;font-size:16px;line-height:1.4">'+m.t;
      (m.b||[]).forEach(function(f){h+='<div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">';
        f.forEach(function(x){B.push(x);h+='<button data-f="b" data-i="'+(B.length-1)+'" style="flex:1 1 40%;min-height:48px;font-size:16px;font-weight:700;border-radius:12px;border:2px solid #1f6feb;background:#fff;color:#123a6b;padding:6px">'+esc(x[0])+'</button>'});h+='</div>'});
      h+='</div>'});
    if(!(res.msgs||[]).length&&res.txt)h+='<div class="av" style="text-align:left;font-size:16px">'+res.txt+'</div>';
    (res.imgs||[]).forEach(function(i){h+='<div style="margin:10px 14px 0"><img src="'+esc(i[0])+'" style="width:100%;border-radius:14px;display:block" loading="lazy"><div style="font-size:14px;color:#5a6577;padding:4px 2px">'+esc(i[1])+'</div></div>'});
    (res.docs||[]).forEach(function(x){B.push([x[1],'u',x[0]]);h+='<button data-f="b" data-i="'+(B.length-1)+'" class="op b" style="margin:10px 14px 0;width:calc(100% - 28px)">📥 DESCARGAR '+esc(x[1])+'</button>'+(x[2]?'<div class="nota">'+esc(x[2])+'</div>':'')});
    h+='<div style="display:flex;gap:8px;margin:12px 14px"><input id="mt" placeholder="✍️ Escribir aquí (código, texto…)" style="flex:1;font-size:18px;padding:12px;border-radius:12px;border:2px solid #cfd6e2"><button data-f="env" style="font-size:17px;padding:0 14px;border-radius:12px;border:0;background:#1f6feb;color:#fff;font-weight:700">ENVIAR</button></div>';
    pantalla({atras:inicio,tit:'☰ Más opciones',sub:'Todo aquí mismo, sin salir',html:h,
      ops:[['☰ VOLVER A MÁS OPCIONES','n',function(){masOpc({accion:'mas'})},1],['🏠 VOLVER AL PANEL','g',function(){if(!res.z)return inicio();cargarZ(res.z,function(d2){if(d2)D=d2;inicio()})}]],
      fn:{b:function(el){var x=B[+el.dataset.i];if(x[1]==='c')masOpc({accion:'cb',data:x[2]});else if(x[1]==='t'&&/^🏠 Panel/.test(x[2]))inicio();else if(x[1]==='t')masOpc({accion:'texto',t:x[2]});else{try{tg.openLink(x[2])}catch(e){location.href=x[2]}}},
        env:function(){var t=($('mt').value||'').trim();if(t)masOpc({accion:'texto',t:t})}}})})
  .catch(function(e){vibra('mal');pantalla({e:'📶⚠️',h1:'No llegó la respuesta',p:esc(e.message),ops:[['🔄 INTENTAR OTRA VEZ','b',function(){masOpc(d)}],['🏠 Volver','n',inicio,1]]})})}

// ------------------------------------------------------------ datos
function lee(cb){var m=location.search.match(/[?&]z=([^&]+)/);if(!m)return cb(null);cargarZ(m[1],cb)}
function cargarZ(z,cb){
  var t=z.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';
  var b=atob(t),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
  if(!window.DecompressionStream)return cb(null,'Actualice Telegram o el teléfono para abrir el panel.');
  new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate'))).text().then(function(s){cb(JSON.parse(s))}).catch(function(){cb(null)})}
function estadoEsc(x){var mal=x.e==='F'||x.ls==='cer'||x.ls==='no'||x.p.indexOf('m')>=0,am=x.ls==='nov'||x.cm||x.p.indexOf('f')>=0;return mal?'r':!x.ls?'n':am?'a':''}
function chipsEsc(x){var l=x.l,s='';
  s+=x.ls==='cer'?'📍🔒 cerrada':x.ls==='no'?'📍⛔ no llegó':l?'📍✅ '+l[0]:x.cm?'📍⬜ 🚧 problema en camino':'📍⬜ sin llegar';
  x.p.forEach(function(e,i){s+=' · 📶'+(i+1)+' '+(e==='b'?'✅':e==='m'?'❌':e==='f'?'⏰':'⬜')});
  return (x.e==='F'?'🔴 <b>CAÍDO '+(x.es!=null?'hace '+dura(x.es):x.ed||'')+'</b> · ':x.e==='A'?'🟢 · ':'')+s}
function notaEsc(x){var n=[];if(x.o)n.push(esc(x.o));
  var i=x.p.indexOf('m');if(i>=0&&x.pd)n.push('prueba '+(i+1)+': '+esc(x.pd[i][2]||'con problema'));
  else{i=x.p.indexOf('f');if(i>=0&&x.pd&&x.pd[i][1])n.push('prueba '+(i+1)+' atrasada '+esc(x.pd[i][1]))}
  if(x.ls==='nov')n.push('llegó con novedades');if(x.cm)n.push('🚧 '+esc(x.cm[1]));return n.join(' · ')}
function unicas(){var v={};return D.f.filter(function(x){if(v[x.c])return false;v[x.c]=1;return true})}
var TKE={por_autorizar:'⏳ por autorizar',consulta_op:'📞 preguntando al operador',por_crear:'🆕 por crear',creado:'🎫 creado',seguimiento:'🔁 seguimiento',intermitente:'〰️ intermitente',reabrir:'↩️ se reabre',en_revision:'🔎 en revisión'};
function dura(seg){if(seg==null)return '';var m=Math.round(seg/60),h=Math.floor(m/60),d=Math.floor(h/24);return d?d+' d '+(h%24)+' h':h?h+' h '+(m%60)+' min':m+' min'}
function tkTxt(x){return x.tk?'🎫 '+(x.tk[1]?'<b>'+esc(x.tk[1])+'</b> · ':'')+(TKE[x.tk[0]]||esc(x.tk[0])):(x.e==='F'?'🚫 <b>sin ticket</b>':'')}
function busca(c,pt){return D.f.filter(function(x){return x.c===c&&(!pt||x.pt===pt)})[0]}

// ------------------------------------------------------------ 1 · inicio
function modoHtml(){if(D.jm===undefined)return '';var M={prueba:'🧪 PRUEBA',simulacro:'🎯 SIMULACRO',elecciones:'🗳️ ELECCIONES',ensayo:'🧪 ENSAYO'};
  return D.jm?'<div class="av ok" style="text-align:center"><b>'+(M[D.jm]||esc(D.jm))+'</b> activado: ya se pueden pedir los tests.</div>'
    :'<div class="av" style="text-align:center;border-color:#c0392b"><b>⛔ No hay simulacro ni prueba activado.</b><br>Los tests se piden cuando el administrador activa el modo.</div>'}
function personalHtml(){var p=D.ps;if(!p)return '';
  var l=function(i,t,v,c){return '<div style="display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid #e6eaf0"><span>'+i+' '+t+'</span><b style="color:'+(c||'#123a6b')+'">'+v+'</b></div>'};
  return '<div class="av" style="text-align:left;font-size:16px;border:2px solid #cfd6e2;background:#fff"><b style="font-size:17px">👥 PERSONAL CONTRATADO</b>'
    +l('👷','Operadores SEA',p.op)+l('🧑‍🤝‍🧑','Asistentes',p.as)
    +l('🏫','Enlaces con personal',p.con+' de '+p.enl)+(p.sin?l('⚠️','Enlaces SIN nadie contratado',p.sin,'#c0392b'):'')
    +l('📱','Operadores en el bot',p.reg)
    +l('🧑‍✈️','Supervisores de grupo',p.sg)+l('🧑‍💼','Supervisores nacionales',p.sn)
    +(p.cpe?l('🖥️','Personal del CPE',p.cpe)+(p.cpe_c||[]).map(function(c){return '<div style="font-size:14px;color:#5a6577;padding:2px 0 2px 26px">'+esc(c[0])+': '+c[1]+'</div>'}).join('')
      :l('🖥️','Personal del CPE','sin cargar','#c0392b'))+'</div>'}
function inicio(){F={};
  pantalla({e:'🧑‍✈️📊',h1:'Así va tu grupo',p:'Datos de las <b>'+esc(D.h)+'</b>'+edad(),
    html:'<div class="kp"><div class="k v"><b>'+D.t.act+'/'+D.t.esc+'</b><span>🟢 Enlaces activos</span></div><div class="k '+(D.t.cai?'r':'v')+'"><b>'+D.t.cai+'</b><span>🔴 Enlaces caídos</span></div>'
      +'<div class="k '+(D.t.lleg?'v':'')+'"><b>'+D.t.lleg+'/'+D.t.esc+'</b><span>📍 Operadores llegaron</span></div><div class="k '+(D.pr.length?'r':'v')+'"><b>'+(D.npr||D.pr.length)+'</b><span>🚨 Problemas</span></div></div>'+modoHtml()+personalHtml(),
    ops:[['🚨 PROBLEMAS','r',problemas,0,(D.npr||D.pr.length)||''],['🔴 ENLACES CAÍDOS ('+D.t.cai+')','r',function(){escuelas('cai')}],['🏫 MIS ESCUELAS ('+D.t.esc+')','b',function(){escuelas('todas')}],].concat(D.pp?[['🎛️ CAMBIAR EL MODO ('+modoNom()+')','n',modos],[activarTxt(),'g',activar],['📢 Pedir test solo a unas escuelas','g',pedir,1]]:[]).concat([
      ['📥 POR AUTORIZAR','a',autorizar,0,D.pa.length||''],['🛠️ REPORTAR DAÑO (TICKET)','n',function(){elegirDanio()},1],D.dv?['🚪 SALIR DE LA PRUEBA (volver a mi panel)','r',function(){hacer({accion:'salir'})}]:['🧪 VER COMO LO VE…','n',verComo,1],['☰ MÁS OPCIONES (incidencias, reportes, QR…)','n',function(){masOpc({accion:'mas'})},1]]),
    nota:'Para ver datos nuevos, cierre y vuelva a tocar <b>📱 ABRIR MI PANEL</b>.'})}

// ------------------------------------------------------------ 📶 activar test 1 → 2 → 3 (solo supervisor nacional y administrador)
function sigTest(){var h={};(D.ord||[]).forEach(function(o){h[o[0]]=o[1]});for(var n=1;n<=3;n++)if(!h[n])return n;var m=3;for(var k in h)m=Math.max(m,+k);return m+1}
function activarTxt(){var n=sigTest();return (n<=3?'📶 ACTIVAR TEST DE CONEXIÓN '+n:'➕ ACTIVAR TEST EXTRA '+n)}
function edad(){if(!D||!D.ts)return '';var m=Math.round((Date.now()/1000-D.ts)/60);if(m<3)return '';   // datos viejos: se dice claro
  return ' · <b style="color:#ffd27a">⚠️ hace '+(m<60?m+' min':m<1440?Math.round(m/60)+' h':Math.round(m/1440)+' día(s)')+'</b>'}
function modoNom(){var M={prueba:'🔧 prueba',simulacro:'🧪 simulacro',elecciones:'🗳️ elecciones',ensayo:'🧰 ensayo'};return D.jm?(M[D.jm]||D.jm):'⛔ normal'}
function modos(){   // 🎛️ solo supervisor nacional / administrador (el servidor lo vuelve a revisar)
  var c=function(m,t,e,p){return function(){
    // ⚠️ dos pasos para todo, menos la PRUEBA (activar prueba, o salir de una prueba, es un solo paso)
    var dos=!(m==='prueba'||(m==='normal'&&(D.jm==='prueba'||D.jm==='ensayo')));
    var hazlo=function(){hacer({accion:'modo',m:m})};
    var segundo=function(){vibra('mal');pantalla({atras:modos,tit:'🎛️ Cambiar el modo',e:'⚠️',h1:'¿ESTÁ USTED SEGURO?',
      p:'Va a <b>'+esc(t.toLowerCase())+'</b>.'+(D.jm?'<br><br>Se <b>cierra</b> el modo actual ('+modoNom()+'): lo que se hizo hasta ahora queda <b>guardado</b> en la página web → Jornada y <b>se empieza de cero</b>.':'')
        +(m!=='normal'?'<br><br>📢 Se le avisa a <b>todo el personal</b> por Telegram.':'<br><br>Ya no se podrán pedir tests y los operadores no enviarán reportes.')
        +'<br><br><b style="color:#c0392b">Esto no se puede deshacer.</b>',
      ops:[['⚠️ SÍ, ESTOY SEGURO','r',hazlo],['❌ NO, CANCELAR','n',modos,1]]})};
    pantalla({atras:modos,tit:'🎛️ Cambiar el modo',e:e,h1:t+'?',p:p,
      ops:[['✅ SÍ, '+t.toUpperCase(),'g',dos?segundo:hazlo],['❌ No','n',modos,1]]})}};
  pantalla({atras:inicio,tit:'🎛️ Cambiar el modo',e:'🎛️',h1:'Modo de hoy: '+modoNom(),p:'Solo el <b>supervisor nacional</b> o el <b>administrador</b> pueden cambiarlo. Al activar un modo se avisa a todo el personal.',
    ops:[['🔧 PRUEBA TÉCNICA','b',c('prueba','Activar PRUEBA TÉCNICA','🔧','Los tickets son de prueba (no van a OTRS). Ya se podrán pedir los tests de conexión.')],
         ['🧪 SIMULACRO','b',c('simulacro','Activar SIMULACRO','🧪','Se cuenta todo como simulacro. Tickets a los 30 minutos de caído (máx. 1 día para autorizar).')],
         ['🗳️ ELECCIONES','r',c('elecciones','Activar ELECCIONES','🗳️','<b>Día de elecciones:</b> los tickets se mandan a los 30 minutos de caído, sin preguntar.')],
         ['⛔ VOLVER A MODO NORMAL','n',c('normal','Volver a MODO NORMAL','⛔','Se cierra y se guarda la jornada de hoy (informe en la página web). Ya no se pedirán tests.')]].filter(function(o){return !(D.jm===''&&/NORMAL/.test(o[0]))||true})})}
function sinJornada(){vibra('mal');pantalla({atras:inicio,tit:'📶 Test de conexión',e:'⛔',h1:'No hay ningún simulacro activado',
  p:'Las pruebas de conexión solo se pueden pedir cuando está activado un modo (🔧 Prueba, 🧪 Simulacro o 🗳️ Elecciones).<br><br>Mientras tanto no se le avisa a ningún operador.',ops:(D.pp?[['🎛️ ACTIVAR UN MODO AHORA','g',modos]]:[]).concat([['🏠 VOLVER AL PANEL','n',inicio,1]])})}
function activar(){if(D.jm==='')return sinJornada();var n=sigTest(),hechos=(D.ord||[]).map(function(o){return '📶'+o[0]+' ✅ '+esc(o[1])}).join(' · ');
  pantalla({atras:inicio,tit:'📶 Test de conexión',sub:'Les llega el aviso al instante',e:'📶📢',h1:'¿Activar el TEST '+n+' ahora?',
    p:'Se avisa a los operadores que <b>ya están en su recinto</b>. De los que no llegaron le digo quiénes son, para que los llame.',

// ------------------------------------------------------------ 🧪 ver como lo ve otro rol
function verComo(){pantalla({atras:inicio,tit:'🧪 Ver como lo ve…',sub:'Es solo para revisar: no cambia nada de nadie',e:'🧪👀',h1:'¿Cómo quiere verlo?',

function elegirGrupo(){var h='<div class="lista">';(D.gl||[]).forEach(function(g,i){h+='<button class="esc n" data-f="g" data-i="'+i+'"><b>🧑‍✈️ '+esc(g)+'</b></button>'});

// ------------------------------------------------------------ 2 · mis escuelas
function escuelas(fl){var filtros=[['todas','Todas'],['cai','🔴 Caídos'],['mal','🚨 Problemas'],['atr','⏰ Atrasadas'],['sin','⬜ Sin llegar']];
  var l=D.f.filter(function(x){var e=estadoEsc(x);return fl==='todas'||(fl==='cai'&&x.e==='F')||(fl==='mal'&&e==='r')||(fl==='atr'&&x.p.indexOf('f')>=0)||(fl==='sin'&&!x.ls)});
  var orden={r:0,a:1,n:2,'':3};l.sort(function(a,b){return fl==='cai'?(b.es||0)-(a.es||0):orden[estadoEsc(a)]-orden[estadoEsc(b)]});
  var h='<div style="display:flex;gap:8px;margin:0 14px 10px"><input id="bq" inputmode="numeric" placeholder="🔎 Código de la escuela" style="flex:1;font-size:19px;padding:12px;border-radius:12px;border:2px solid #cfd6e2"><button data-f="bq" style="font-size:18px;padding:0 16px;border-radius:12px;border:0;background:#1f6feb;color:#fff;font-weight:700">BUSCAR</button></div><div class="fil">'+filtros.map(function(f){return '<button data-f="fil" data-v="'+f[0]+'" class="'+(f[0]===fl?'on':'')+'">'+f[1]+'</button>'}).join('')+'</div><div class="lista">';
  l.forEach(function(x){h+='<button class="esc '+estadoEsc(x)+'" data-f="ver" data-c="'+x.c+'" data-p="'+x.pt+'"><b>'+esc(x.c)+(x.pt>1?' (punto '+x.pt+')':'')+' · '+esc(x.n)+'</b><div class="s">'+chipsEsc(x)+'</div><div class="m">'+(notaEsc(x)||'&nbsp;')+(x.e==='F'||x.tk?'<br>'+tkTxt(x):'')+'</div></button>'});
  if(fl==='cai'&&l.length)h='<div class="av" style="text-align:left">🔴 <b>'+l.length+' caído(s)</b> · el que más lleva: <b>'+esc(l[0].c)+'</b> '+esc(l[0].n)+' — hace <b>'+dura(l[0].es)+'</b><br>🎫 con ticket: '+l.filter(function(x){return x.tk}).length+' · 🚫 sin ticket: '+l.filter(function(x){return !x.tk}).length+'</div>'+h;
  if(!l.length)h+='<div class="av ok"><b class="t">✅ Nada por aquí</b></div>';
  h+='</div>'+(D.mas?'<div class="nota">… y '+D.mas+' puntos más que están bien.</div>':'');
  pantalla({atras:inicio,tit:'🏫 Mis escuelas ('+D.t.esc+')',sub:'Toque una para ver todo',html:h,
    fn:{bq:function(){var c=(document.getElementById('bq').value||'').replace(/\D/g,'');if(!c)return;if(busca(c))escuela(c,1,function(){escuelas(fl)});else escuelaCod(c,function(){escuelas(fl)})},fil:function(el){escuelas(el.dataset.v)},ver:function(el){escuela(el.dataset.c,+el.dataset.p,function(){escuelas(fl)})}}})}

// ------------------------------------------------------------ 3 · una escuela
var SN={si:'sí',no:'no'};
function escuela(c,pt,volver){var x=busca(c,pt);if(!x)return inicio();var l=x.l,h='';
  h+='<div class="q" style="padding-top:8px"><div class="e" style="font-size:46px">👤</div><h1 style="font-size:21px">'+esc(x.o||'Sin operador en la lista')+'</h1><p>'+(x.e==='F'?'🔴 El monitoreo lo marca CAÍDO':x.e==='A'?'🟢 El monitoreo lo marca ACTIVO':'')+'</p></div><h3>Hoy</h3>';
  if(l&&l[8])h+='<div class="lin"><i>🚗</i><div>Salió '+esc(l[8])+(l[9]?' · '+esc(l[9])+' km':'')+'</div></div>';
  if(x.cm)h+='<div class="lin"><i>🚧</i><div>'+esc(x.cm[0])+' · '+esc(x.cm[1])+(x.cm[2]?'<small>km '+esc(x.cm[2])+' de su ruta</small>':'')+'</div></div>';
  if(x.ls==='no')h+='<div class="lin"><i>⛔</i><div>No pudo llegar '+esc(l[0])+'<small>'+esc(l[10])+'</small></div></div>';
  else if(l)h+='<div class="lin"><i>'+(x.ls==='cer'?'🔒':'📍')+'</i><div>Llegó '+esc(l[0])+(l[1]!=null?' · a '+esc(l[1])+' m':'')+'<small>'
    +(x.ls==='cer'?'ESCUELA CERRADA':'Abierta · acceso '+(l[3]==='no'?'⛔ difícil':'fácil')+' · inundación '+(l[4]==='si'?'⚠️ sí':'no')+' · corte en el sector '+(l[5]==='si'?'⚠️ sí':'no')
    +' · luz en la escuela '+(l[6]==='no'?'⛔ NO':'sí')+' · equipos '+(l[7]==='si'?'prendidos':l[7]==='no/si'?'apagados → ya prendieron':l[7]==='no/no'?'⛔ NO prenden':'—'))+'</small></div></div>';
  else h+='<div class="lin"><i>⬜</i><div>Todavía no llega</div></div>';
  x.p.forEach(function(e,i){var d=(x.pd||[])[i]||['','',''];
    h+='<div class="lin"><i>'+(e==='b'?'✅':e==='m'?'❌':e==='f'?'⏰':'⬜')+'</i><div>Prueba '+(i+1)+(d[0]?' · '+esc(d[0]):'')+(d[1]?' ('+esc(d[1])+')':'')
      +'<small>'+(e==='b'?'Bien':e==='m'?esc(d[2]||'Con problema'):e==='f'?'Ya le tocaba y no la hace':'Todavía no le toca')+'</small></div></div>'});
  var sig=x.p.indexOf('m')>=0?x.p.indexOf('m')+1:x.p.indexOf('f')>=0?x.p.indexOf('f')+1:Math.min(3,x.p.lastIndexOf('b')+2||1);
  pantalla({atras:volver||inicio,tit:esc(x.c)+' · '+esc(x.n),sub:'Punto '+x.pt,html:h,
    ops:[['📞 LLAMAR AL OPERADOR','g',function(){hacer({accion:'llamar',cod:x.c})}],['📷 VER LAS FOTOS','b',function(){hacer({accion:'fotos',cod:x.c})}],
      ].concat(D.pp?[['📢 PEDIRLE LA PRUEBA '+sig,'a',function(){if(D.jm==='')return sinJornada();hacer({accion:'pedir',n:sig,cods:[x.c]})}]]:[]).concat([['🛠️ REPORTAR DAÑO (TICKET)','r',function(){danio(x.c,function(){escuela(c,pt,volver)})}]]),
    nota:D.ch?'Teléfonos y fotos se ven aquí mismo.':'Teléfonos y fotos le llegan en el chat del bot.'})}

function escuelaCod(c,volver){
  pantalla({atras:volver,tit:'🏫 Escuela '+esc(c),e:'🏫',h1:'Escuela '+esc(c),p:'Esta escuela está bien, por eso no sale en la lista. Igual puede:',
    ops:[['📞 LLAMAR AL OPERADOR','g',function(){hacer({accion:'llamar',cod:c})}],['📷 VER LAS FOTOS','b',function(){hacer({accion:'fotos',cod:c})}]]
      .concat(D.pp?[['📢 PEDIRLE UNA PRUEBA','a',function(){if(D.jm==='')return sinJornada();hacer({accion:'pedir',n:D.nx>3?3:D.nx,cods:[c]})}]]:[]).concat([['🛠️ REPORTAR DAÑO (TICKET)','r',function(){danio(c,function(){escuelaCod(c,volver)})}]])})}

// ------------------------------------------------------------ 4 · problemas
function problemas(){var h='';
  if(!D.pr.length)h='<div class="av ok"><b class="t">✅ Sin problemas</b>Todo su grupo va bien.</div>';
  D.pr.forEach(function(p,i){var am=p[1]==='⚠️'||p[1]==='⏰'||p[1]==='🚧';var tk=p[1]==='❌'||p[1]==='🔴';
    h+='<div class="av '+(am?'am':'')+'"><b class="t">'+p[1]+' '+esc(p[2])+'</b>'+esc(p[0])+' · '+esc(p[3])+'</div>'
      +'<div class="fila2"><button class="op g" data-f="llamar" data-c="'+p[0]+'">📞 LLAMAR</button><button class="op b" data-f="ver" data-c="'+p[0]+'">🔎 VER</button>'
      +(tk?'<button class="op r" data-f="tk" data-c="'+p[0]+'">🛠️ TICKET</button>':'<button class="op n" data-f="ok" data-c="'+p[0]+'">✅ RESUELTO</button>')+'</div>'});
  if((D.npr||0)>D.pr.length)h+='<div class="nota">Se muestran los '+D.pr.length+' más urgentes. Vea todos en 🏫 Mis escuelas → 🔴 Caídos.</div>';
  pantalla({atras:inicio,tit:'🚨 Problemas ('+(D.npr||D.pr.length)+')',sub:'Lo más urgente primero',html:h+'<div style="height:10px"></div>',
    fn:{llamar:function(el){hacer({accion:'llamar',cod:el.dataset.c})},ver:function(el){escuela(el.dataset.c,0,problemas)},
        tk:function(el){danio(el.dataset.c,problemas)},ok:function(el){hacer({accion:'resuelto',cod:el.dataset.c})}}})}

// ------------------------------------------------------------ 5 · pedir prueba
function pedir(){if(D.jm==='')return sinJornada();F.n=F.n||1;F.cods=F.cods||null;
  var ns=[1,2,3,D.nx],h='<div class="seg">'+ns.map(function(n,i){return '<button data-f="n" data-n="'+n+'" class="'+(F.n===n?'on':'')+'">'+(i===3?'➕'+n:n)+'</button>'}).join('')+'</div>';
  var falta=D.f.filter(function(x){return x.p[Math.min(F.n,3)-1]!=='b'}).length;
  h+='<h3>¿A quién?</h3>';
  pantalla({atras:inicio,tit:'📢 Pedir prueba',sub:'Les llega el aviso al instante',e:'📢📶',h1:'¿Qué prueba?',p:'Horas normales: '+esc((D.hp||[]).join(', ')),html:h,
    ops:[['👥 A TODOS<br><small style="font-weight:600">(solo a los que ya están en su recinto; de los demás le digo quiénes son)</small>','b',function(){confirma('todo su grupo',null)}],
      ['🏫 ELEGIR ESCUELAS','n',elegir]],fn:{n:function(el){F.n=+el.dataset.n;pedir()}}})}
function elegir(){F.sel=F.sel||{};var h='<div class="lista">';
  unicas().forEach(function(x){h+='<button class="esc '+estadoEsc(x)+'" data-f="t" data-c="'+x.c+'"><b>'+(F.sel[x.c]?'☑️':'⬜')+' '+esc(x.c)+' · '+esc(x.n)+'</b><div class="s">'+chipsEsc(x)+'</div></button>'});
  var n=Object.keys(F.sel).length;
  pantalla({atras:pedir,tit:'🏫 Elegir escuelas',sub:'Prueba '+F.n+' · toque para marcar',html:h+'</div>',
    ops:n?[['✅ PEDIR A '+n+' ESCUELA'+(n>1?'S':''),'g',function(){confirma(n+' escuela(s)',Object.keys(F.sel))}]]:[],
    fn:{t:function(el){var c=el.dataset.c;if(F.sel[c])delete F.sel[c];else F.sel[c]=1;var y=window.scrollY;elegir();window.scrollTo(0,y)}}})}
function confirma(a,cods){pantalla({atras:pedir,tit:'📢 Pedir prueba',e:'📢',h1:'¿Pedir la PRUEBA '+F.n+' ahora?',p:'A '+esc(a)+'.',
  ops:[['✅ SÍ, ENVIAR AHORA','g',function(){hacer({accion:'pedir',n:F.n,cods:cods||[]})}],['↩ No, volver','n',pedir,1]]})}

// ------------------------------------------------------------ 6 · por autorizar
var TIPO={fibra:'🧵 Fibra',equipo:'🖥️ Equipo',enlace:'📡 Enlace caído',otro:'❓ Otro'};
function autorizar(){var h='';
  if(!D.pa.length)h='<div class="av ok"><b class="t">✅ Nada por autorizar</b>Ningún operador reportó daños.</div>';
  D.pa.forEach(function(p){h+='<div class="av am" style="text-align:left"><b>'+esc(p[0])+' · '+esc(p[1])+'</b><br>👤 '+esc(p[4])+': '+(TIPO[p[2]]||'')+(p[3]?' <i>«'+esc(p[3])+'»</i>':'')
    +'<br>📡 El monitoreo marca: <b>'+esc(p[5]||'—')+'</b> · espera '+esc(p[6])+'</div>'
    +'<div class="fila2"><button class="op g" data-f="a" data-v="si" data-c="'+p[0]+'">✅ CREAR</button><button class="op r" data-f="a" data-v="no" data-c="'+p[0]+'">❌ NO</button><button class="op n" data-f="a" data-v="lu" data-c="'+p[0]+'">⏸️ DESPUÉS</button></div>'});
  pantalla({atras:inicio,tit:'📥 Por autorizar ('+D.pa.length+')',sub:'Daños que reportaron los operadores',e:D.pa.length?'🛠️🌐':'',h1:D.pa.length?'¿Se crea el ticket?':'',html:h+'<div style="height:10px"></div>',
    fn:{a:function(el){hacer({accion:'autorizar',cod:el.dataset.c,val:el.dataset.v})}}})}

// ------------------------------------------------------------ 🛠️ daño
function elegirDanio(){var h='<div class="lista">';
  unicas().forEach(function(x){h+='<button class="esc '+estadoEsc(x)+'" data-f="c" data-c="'+x.c+'"><b>'+esc(x.c)+' · '+esc(x.n)+'</b><div class="s">'+chipsEsc(x)+'</div></button>'});
  pantalla({atras:inicio,tit:'🛠️ Reportar daño',sub:'¿En qué escuela?',html:h+'</div>',fn:{c:function(el){danio(el.dataset.c,elegirDanio)}}})}
function danio(c,volver){var x=busca(c)||{n:''};
  pantalla({atras:volver,tit:'🛠️ '+esc(c)+' · '+esc(x.n),sub:'El ticket se genera solo',e:'🛠️❓',h1:'¿Qué se dañó?',
    ops:[['🧵 FIBRA','r',function(){danioOk(c,'fibra',volver)}],['🖥️ EQUIPO','r',function(){danioOk(c,'equipo',volver)}],['📡 ENLACE CAÍDO','a',function(){danioOk(c,'enlace',volver)}],['❓ OTRO','n',function(){danioOk(c,'otro',volver)}]]})}
function danioOk(c,t,volver){pantalla({atras:function(){danio(c,volver)},tit:'🛠️ '+esc(c),e:'🎫',h1:'¿Generar el ticket?',p:esc(TIPO[t])+' en la escuela <b>'+esc(c)+'</b>.',
  html:D.otrs?'<div class="av am" style="text-align:left;font-size:15px">'+D.otrs.replace(/\n/g,'<br>')+'</div>':'',
  ops:[['✅ SÍ, GENERAR TICKET','g',function(){hacer({accion:'danio',cod:c,tipo:t})}],['↩ No, volver','n',function(){danio(c,volver)},1]]})}

window.__sup={inicio:inicio};
var REFR=false,EN_INICIO=false;
function refrescar(){if(REFR||!D||!D.ch)return;REFR=true;var b=document.querySelector('.top small');if(b&&EN_INICIO)b.innerHTML='🔄 Actualizando datos…';
  canal(D.ch,D.ci,D.fr,{accion:'refrescar'}).then(function(res){if(!res.z){REFR=false;if(EN_INICIO)inicio();return}cargarZ(res.z,function(d2){REFR=false;if(d2){D=d2;if(EN_INICIO)inicio()}})}).catch(function(){REFR=false;if(EN_INICIO)inicio()})}
var _inicio0=inicio;inicio=function(){var r=_inicio0.apply(this,arguments);EN_INICIO=true;return r};
var _pant0=pantalla;pantalla=function(o){EN_INICIO=false;return _pant0.apply(this,arguments)};
lee(function(d,err){if(!d){$('app').innerHTML='<div class="q" style="padding-top:60px"><div class="e">📱</div><h1>Abra el panel desde el bot</h1><p>'+(err||'En Telegram, toque <b>📱 ABRIR MI PANEL</b>.')+'</p></div>';return}D=d;inicio();
  if(D.ch&&(!D.ts||Date.now()/1000-D.ts>90||D.jm===undefined))refrescar();     // el botón puede tener datos viejos: se actualiza solo
  setInterval(function(){if(EN_INICIO&&D&&D.ch&&Date.now()/1000-(D.ts||0)>180)refrescar()},60000)});
})();
