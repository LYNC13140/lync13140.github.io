<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Panel del supervisor</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--fondo:#fff8ec;--azul:#123a6b;--txt:#1b2333;--mut:#5a6577;--verde:#2e9e5b;--rojo:#d64545;--ambar:#e39a19;--celeste:#2f80ed;--gris:#e2d6c0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--fondo);color:var(--txt);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
#app{min-height:100vh;padding:0 0 calc(18px + env(safe-area-inset-bottom))}
.top{background:var(--azul);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:2}
.top .atras{font-size:26px;background:none;border:0;color:#fff;padding:0 6px 0 0}
.top b{font-size:18px;line-height:1.2;display:block}.top small{font-size:13px;opacity:.85}
.q{text-align:center;padding:12px 16px 4px}.q .e{font-size:66px;line-height:1.1}.q h1{font-size:25px;line-height:1.15;color:var(--azul);margin:8px 0 4px}.q p{font-size:16px;color:var(--mut);margin:0}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:10px 14px}
.k{background:#fff;border:3px solid var(--gris);border-radius:16px;padding:9px 6px;text-align:center}.k b{font-size:28px;display:block;color:var(--azul)}.k span{font-size:14px;color:var(--mut);font-weight:700}
.k.v{border-color:#9fd8b6;background:#eaf8ef}.k.v b{color:var(--verde)}.k.r{border-color:#f0b0b0;background:#fdeeee}.k.r b{color:var(--rojo)}.k.a{border-color:#f1d08a;background:#fff6df}.k.a b{color:#b87700}
.ops{padding:6px 14px 0}
.op{display:block;width:100%;border:0;border-radius:20px;padding:17px 12px;margin:0 0 12px;color:#fff;font-size:21px;font-weight:800;line-height:1.2;box-shadow:0 5px 0 rgba(0,0,0,.2);text-align:center;font-family:inherit;position:relative}
.op:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.op.g{background:var(--verde)}.op.r{background:var(--rojo)}.op.a{background:var(--ambar)}.op.b{background:var(--celeste)}.op.n{background:#5b6b82}
.op.chico{font-size:17px;padding:13px 10px}
.badge{position:absolute;right:14px;top:50%;transform:translateY(-50%);background:#fff;color:var(--rojo);border-radius:14px;padding:2px 11px;font-size:18px}
.fil{display:flex;gap:6px;padding:10px 12px 2px;flex-wrap:wrap}
.fil button{background:#fff;border:2px solid var(--gris);border-radius:14px;padding:7px 11px;font-weight:700;font-size:15px;font-family:inherit;color:var(--txt)}
.fil .on{background:var(--azul);color:#fff;border-color:var(--azul)}
.lista{padding:8px 12px}
.esc{display:block;width:100%;text-align:left;background:#fff;border:0;border-radius:16px;padding:11px 12px;margin-bottom:9px;border-left:9px solid var(--verde);box-shadow:0 2px 0 rgba(0,0,0,.08);font-family:inherit;color:var(--txt)}
.esc.r{border-left-color:var(--rojo)}.esc.a{border-left-color:var(--ambar)}.esc.n{border-left-color:#aab}
.esc b{font-size:16px;color:var(--azul)}.esc .s{font-size:16px;margin-top:4px}.esc .m{font-size:13px;color:var(--mut);margin-top:2px}
.esc input{width:24px;height:24px;vertical-align:middle;margin-right:8px}
.lin{display:flex;gap:10px;padding:7px 16px;font-size:17px;align-items:flex-start}.lin i{font-style:normal;font-size:22px;width:30px;flex:0 0 30px}.lin small{color:var(--mut);display:block;font-size:14px}
h3{margin:14px 16px 4px;color:var(--azul);font-size:17px}
.av{margin:10px 14px 0;padding:12px;border-radius:16px;background:#fdeeee;border:3px dashed #e88;font-size:16px;text-align:center;line-height:1.35}
.av.am{background:#fff3cd;border-color:#e0b84a}.av.ok{background:#eaf8ef;border-color:#9fd8b6}
.av b.t{font-size:19px;display:block}
.fila2{display:flex;gap:8px;padding:8px 14px 0}.fila2 .op{margin:0;font-size:16px;padding:12px 6px}
.seg{display:flex;gap:8px;padding:6px 14px}.seg button{flex:1;padding:15px 0;border-radius:16px;background:#fff;border:3px solid var(--gris);font-size:22px;font-weight:800;color:var(--azul);font-family:inherit}
.seg .on{background:var(--azul);color:#fff;border-color:var(--azul)}
.nota{font-size:14px;color:var(--mut);text-align:center;padding:10px 16px}
.girar{display:inline-block;animation:g 1.2s linear infinite}.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:800;background:#e8eefc;color:#1f3b66;margin:0 4px 4px 0}@keyframes g{to{transform:rotate(360deg)}}
</style>
<style id="tema2026">
/* ✨ TEMA 2026 «futurista» para las Mini Apps de Telegram — SOLO aspecto. No cambia nada de cómo funciona. */
:root{--fondo:#050a17;--azul:#8fd8ff;--txt:#e9f1ff;--mut:#9fb3d6;--gris:rgba(120,170,255,.22);
 --verde:#22c55e;--rojo:#f43f5e;--ambar:#f59e0b;--celeste:#3b82f6;

html{background:#050a17}
body{font-family:'Inter','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif!important;color:var(--txt)!important;background:
 radial-gradient(700px 420px at 0% -5%,rgba(59,130,246,.24),transparent 60%),

 radial-gradient(600px 500px at 50% 115%,rgba(34,211,238,.12),transparent 60%),

h1,h2,h3,.top b,.grande,.k b{font-family:'Space Grotesk','Inter','Segoe UI',system-ui,sans-serif;letter-spacing:.2px}
/* barra de arriba de vidrio */
.top{background:linear-gradient(180deg,rgba(10,20,45,.92),rgba(8,15,34,.86))!important;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
 border-bottom:1px solid transparent!important;border-image:linear-gradient(90deg,transparent,rgba(34,211,238,.6),rgba(139,92,246,.6),transparent) 1!important;box-shadow:0 10px 26px -16px rgba(34,211,238,.45)}

/* barra de avance */
.prog i{background:rgba(255,255,255,.08)!important}.prog i.on{background:linear-gradient(90deg,#22c55e,#22d3ee)!important;box-shadow:0 0 12px -2px #22d3ee}
/* BOTONES grandes: degradado con brillo, se hunden al tocar */
.op{border:1px solid rgba(255,255,255,.14)!important;box-shadow:0 10px 24px -12px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.22)!important;text-shadow:0 1px 2px rgba(0,0,0,.35);
 transition:transform .12s ease,box-shadow .2s ease,filter .2s;position:relative;overflow:hidden}
.op::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.16),transparent 45%);pointer-events:none}
.op:active{transform:translateY(2px) scale(.97)!important;filter:brightness(1.15);box-shadow:0 0 0 2px rgba(255,255,255,.25),0 0 26px -4px currentColor!important}
.op.g{background:linear-gradient(135deg,#16a34a,#22c55e 55%,#2dd4bf)!important;box-shadow:0 12px 28px -12px rgba(34,197,94,.75),inset 0 1px 0 rgba(255,255,255,.25)!important}
.op.r{background:linear-gradient(135deg,#be123c,#f43f5e 60%,#fb7185)!important;box-shadow:0 12px 28px -12px rgba(244,63,94,.75),inset 0 1px 0 rgba(255,255,255,.25)!important}
.op.a{background:linear-gradient(135deg,#d97706,#f59e0b 55%,#fbbf24)!important;box-shadow:0 12px 28px -12px rgba(245,158,11,.7),inset 0 1px 0 rgba(255,255,255,.25)!important}
.op.b{background:linear-gradient(135deg,#6d5dfc,#3b82f6 55%,#22d3ee)!important;box-shadow:0 12px 28px -12px rgba(59,130,246,.85),inset 0 1px 0 rgba(255,255,255,.25)!important}
.op.n{background:linear-gradient(135deg,#334766,#46608a)!important}
.op:disabled,.op[disabled]{opacity:.5;filter:grayscale(.4)}
.badge{background:#fff!important;color:#e11d48!important;box-shadow:0 0 14px -2px rgba(255,255,255,.7)}
/* tarjetas y chips de vidrio */
.chip,.k,.esc,.it,.fil button,.seg button{background:var(--g-glass)!important;border-color:var(--g-line2)!important;color:var(--txt)!important;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.chip.ok,.k.v{background:linear-gradient(160deg,rgba(34,197,94,.20),rgba(17,29,54,.78))!important;border-color:rgba(34,197,94,.55)!important}
.chip.mal,.k.r{background:linear-gradient(160deg,rgba(244,63,94,.20),rgba(17,29,54,.78))!important;border-color:rgba(244,63,94,.55)!important}
.k.a{background:linear-gradient(160deg,rgba(245,158,11,.20),rgba(17,29,54,.78))!important;border-color:rgba(245,158,11,.55)!important}
.k{border-width:1px!important;box-shadow:0 10px 26px -14px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.05);transition:transform .15s,box-shadow .2s,border-color .2s}
.k:active{transform:scale(.97)!important;box-shadow:var(--g-glow);border-color:rgba(34,211,238,.7)!important}
.k b{color:#f3f8ff}.k.v b,.ok b{color:#4ade80!important}.k.r b,.bad b{color:#fb7185!important}.k.a b,.warn b{color:#fbbf24!important}
.k span,.k small{color:#a9bde0!important}
.esc{box-shadow:0 8px 22px -14px rgba(0,0,0,.9)!important;transition:transform .12s,box-shadow .2s}
.esc:active{transform:scale(.98);box-shadow:var(--g-glow)!important}
.esc b{color:#bfe6ff!important}.esc .m{color:var(--mut)!important}
.esc.r{border-left-color:#f43f5e!important}.esc.a{border-left-color:#f59e0b!important}.esc:not(.r):not(.a):not(.n){border-left-color:#22c55e!important}
.fil button,.seg button{transition:all .15s}
.fil .on,.seg .on{background:linear-gradient(135deg,rgba(59,130,246,.55),rgba(34,211,238,.35))!important;border-color:rgba(34,211,238,.7)!important;color:#fff!important;box-shadow:var(--g-glow)}
.lin small{color:var(--mut)!important}
/* avisos */
.aviso,.av{background:linear-gradient(160deg,rgba(245,158,11,.16),rgba(17,29,54,.8))!important;border:1px solid rgba(245,158,11,.55)!important;color:#fde7b0}
.aviso.mal,.av:not(.am):not(.ok){background:linear-gradient(160deg,rgba(244,63,94,.17),rgba(17,29,54,.8))!important;border-color:rgba(244,63,94,.55)!important;color:#ffd5dc}
.av.ok{background:linear-gradient(160deg,rgba(34,197,94,.16),rgba(17,29,54,.8))!important;border-color:rgba(34,197,94,.55)!important;color:#c9f7d8}
.sup a{color:#7dd3fc!important;text-shadow:0 0 16px rgba(34,211,238,.45)}
/* colores puestos dentro del texto: los pasamos a versión que se lea en oscuro */

[style*="color:#1a7f37"]{color:#4ade80!important}

button[style*="background:#132a57"]{background:var(--g-glass)!important;border-color:var(--g-line2)!important}
button[style]:active{transform:scale(.97)}
input:not([type=checkbox]):not([type=radio]){min-width:0;max-width:100%}
button[style*="background:#1f6feb"]{background:linear-gradient(135deg,#6d5dfc,#3b82f6 55%,#22d3ee)!important;box-shadow:0 10px 24px -12px rgba(59,130,246,.85)}
/* cámara: igual negro, solo el botón de disparo brilla */
.disparo{box-shadow:0 0 0 4px rgba(34,211,238,.35),0 0 30px -4px rgba(34,211,238,.8)}

<style id="ios-tema">

 --ch-g:linear-gradient(145deg,#e6fbef,#a9ecc6);--ch-a:linear-gradient(145deg,#fff4dc,#ffd78a);--ch-v:linear-gradient(145deg,#f1eaff,#cdb8ff);
 --i-chsh:inset 0 1px 0 rgba(255,255,255,.9),0 6px 14px -8px rgba(15,25,60,.35);

 --txt:var(--i-tx);--mut:var(--i-mu);--tx:var(--i-tx);--mu:var(--i-mu);--g-glass:var(--i-card);--g-line:var(--i-line);--g-line2:var(--i-line);

/* ---------- base ---------- */
html{background:var(--i-bg)!important;-webkit-text-size-adjust:100%;text-size-adjust:100%}
:root body{font-family:var(--i-font)!important;color:var(--i-tx)!important;background:transparent!important;background-attachment:scroll!important;
 -webkit-font-smoothing:antialiased;overflow-x:clip;line-height:1.35}
:root body.bienvF{background:transparent!important}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:340px;z-index:-1;pointer-events:none;
 background:radial-gradient(70% 100% at 10% 0%,var(--i-aurora1),transparent 70%),radial-gradient(55% 90% at 95% 0%,var(--i-aurora2),transparent 70%)}
:root h1,:root h2,:root h3,:root .top b,:root .grande,:root .k b{font-family:var(--i-font)!important;letter-spacing:-.02em}
:root h1,:root h2,:root h3{text-shadow:none!important}
:root .q h1,:root .top h1,:root h2{color:var(--i-tx)!important;font-weight:800}
:root .q h1{font-size:clamp(26px,7.6vw,32px);line-height:1.12;letter-spacing:-.03em;text-wrap:balance}
:root .q p,:root .nota,:root .mu{color:var(--i-mu)!important}
:root .q p{line-height:1.4}
:root h3{color:var(--i-tx)!important;font-size:20px;font-weight:700;margin-top:20px}
:root h2{font-size:26px;letter-spacing:-.025em}
:root .k b,:root .grande,:root .badge,:root .paso,:root .top small,:root .av b,:root .esc .s,:root .lin,:root .pill,:root .vivo{font-variant-numeric:tabular-nums}
:root .grande{color:var(--i-tx)!important;text-shadow:none!important;font-weight:800;letter-spacing:-.03em}
::selection{background:rgba(6,182,212,.30)}
:focus-visible{outline:3px solid var(--i-ring);outline-offset:2px}

/* ---------- barra superior de vidrio (solo la barra fija; sin blur en el resto) ---------- */
:root .top{position:sticky;top:0;z-index:20;margin-inline:calc(50% - 50vw);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
 background:var(--i-bar-solid)!important;border:0!important;border-image:none!important;box-shadow:0 .5px 0 var(--i-line)!important;color:var(--i-tx)}

(function(){

 var defs='<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="'+(fin?'#34d399':'#38bdf8')+'"/><stop offset="1" stop-color="'+(fin?'#0b7a6d':'#1d5fe0')+'"/></linearGradient></defs>';

 var base='<circle class="fin-halo" cx="100" cy="100" r="92" fill="'+col+'" opacity=".16"/><circle cx="100" cy="100" r="72" fill="url(#'+id+')"/><circle cx="100" cy="100" r="72" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2"/>';
 var cuerpo=fin
  ?'<path class="fin-trazo" d="M66 102 L90 126 L136 76" fill="none" stroke="#fff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>'
   +'<circle cx="30" cy="48" r="5" fill="#fbbf24"/><circle cx="170" cy="38" r="4" fill="#f472b6"/><circle cx="178" cy="136" r="5" fill="#60a5fa"/><circle cx="24" cy="146" r="4" fill="#a78bfa"/>'
  :'<g class="fin-gira"><path d="M62 98 A38 38 0 0 1 128 74" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round"/><path d="M138 102 A38 38 0 0 1 72 126" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round"/>'
   +'<path d="M132 52 L136 84 L104 80 Z" fill="#fff" stroke="#fff" stroke-width="4" stroke-linejoin="round"/><path d="M68 148 L64 116 L96 120 Z" fill="#fff" stroke="#fff" stroke-width="4" stroke-linejoin="round"/></g>';
 return '<svg class="fin-ill" viewBox="0 0 200 200" aria-hidden="true" focusable="false">'+defs+base+cuerpo+'</svg>'}
function cerrar(){
 var t=tgw(),dentro=false;
 try{dentro=!!(t&&typeof t.close==='function'&&(t.initData||(t.initDataUnsafe&&t.initDataUnsafe.auth_date)))}catch(e){}
 if(dentro){try{t.close();return}catch(e){}}
 try{W.location.reload()}catch(e){}}
function apaga(){
 var t=tgw();
 try{IV.forEach(function(i){clearInterval(i)})}catch(e){}
 try{if(t){try{t.MainButton.hide()}catch(e){}try{t.BackButton.hide()}catch(e){}try{t.disableClosingConfirmation()}catch(e){}
  var h=t.HapticFeedback;if(h)['impactOccurred','notificationOccurred','selectionChanged'].forEach(function(k){try{h[k]=function(){return h}}catch(e){}})}}catch(e){}
 try{navigator.vibrate=function(){return false}}catch(e){}}
function mostrar(o){
 o=o||{};done=true;
 var fin=!!(+o.fin||o.fin===true);
 var titulo=o.titulo||(fin?'✅ La prueba terminó':'🔄 '+(o.txt||o.texto?'El sistema cambió':'El modo cambió'));
 var texto=o.texto||o.txt||(fin?'Gracias por participar. Toque <b>CERRAR</b> y vuelva a entrar desde el bot cuando le avisen.':'Toque <b>CERRAR</b> y vuelva a abrir la aplicación desde el bot.');

 if(!el){el=doc.createElement('div');el.id='fin-sesion';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-labelledby','fin-t');el.setAttribute('aria-describedby','fin-p');
  el.addEventListener('keydown',function(e){if(e.key==='Tab'||e.keyCode===9){e.preventDefault();var b=doc.getElementById('fin-btn');if(b)b.focus()}});
  doc.body.appendChild(el)}
 var foto='';try{var n=+localStorage.getItem('fxFotoUlt')||1;foto='fondos/'+(n<10?'0':'')+n+'.webp'}catch(e){foto='fondos/01.webp'}
 el.className=fin?'fin-ok':'';

 var b=doc.getElementById('fin-btn');b.onclick=cerrar;
 try{[].forEach.call(doc.body.children,function(c){if(c!==el&&c.tagName!=='SCRIPT'&&c.tagName!=='STYLE'){try{c.inert=true}catch(e){}c.setAttribute('aria-hidden','true')}})}catch(e){}
 try{doc.activeElement&&doc.activeElement!==b&&doc.activeElement.blur&&doc.activeElement.blur()}catch(e){}
 apaga();try{W.scrollTo(0,0)}catch(e){}try{b.focus()}catch(e){}
 try{var t=tgw();if(t){t.ready&&t.ready();t.expand&&t.expand()}}catch(e){}
 return true}
function esVieja(x){return !!(x&&/\bvieja\b|\bviejo\b|sesi[oó]n vencida/i.test(x.message||x.txt||''))}
W.FIN={mostrar:mostrar,activa:function(){return done},esVieja:esVieja,
 envuelve:function(p){return p.catch(function(e){if(esVieja(e)){mostrar({texto:e.message});return new Promise(function(){})}throw e})},
 chequeaIni:function(ini){   // la pantalla se abrió ANTES de que empezara la jornada/modo actual (ini = epoch en s o ms)
  ini=+ini;if(!ini)return false;if(ini>1e12)ini=Math.floor(ini/1000);
  var ad=0;try{ad=+(tgw().initDataUnsafe.auth_date)||0}catch(e){}
  if(ad&&ad<ini){mostrar({fin:0});return true}return false}};
})();

<script>
(function(){

function alBot(d){pantalla({e:'📨',h1:'Enviando…',p:'Siga en el chat del bot.'});

// 🔁 canal de ida y vuelta: la app NO se cierra (el pedido va a la PC por el servidor de paso y la respuesta vuelve aquí)
var ALT=[];   // servidores de reserva (si el de casa está lleno o caído)
function postRelay(FR,path,opt){var l=[FR].concat((opt.alt||ALT).filter(function(x){return x&&x!==FR})),i=0,lleno=false;
  return new Promise(function(ok,mal){(function prueba(){var R=l[i];
    var ctl=window.AbortController?new AbortController():null,tt=setTimeout(function(){if(ctl)ctl.abort()},opt.ms||20000);
    fetch(R+'/'+path,{method:opt.method||'POST',headers:opt.headers||{},body:opt.body,signal:ctl?ctl.signal:undefined}).then(function(r){clearTimeout(tt);if(r.status===410){FIN.mostrar({vieja:1});return}
      if(r.ok)return ok({r:r,rel:R});if(r.status===429||r.status===413||r.status===507)lleno=true;sig(r.status)},function(){clearTimeout(tt);sig(0)});
    function sig(st){i++;if(i<l.length)return prueba();var x=new Error(lleno?'lleno':st?'envío':'Sin señal');x.envio=!lleno;x.lleno=lleno;mal(x)}})()})}
function canal(CH,CI,FR,d){return FIN.envuelve(canal0(CH,CI,FR,d))}
function canal0(CH,CI,FR,d){ALT=(typeof D!=='undefined'&&D&&D.frs)||ALT;
  var id=Math.random().toString(36).slice(2,10)+Date.now().toString(36),t0=Math.floor(Date.now()/1000)-3;
  return postRelay(FR,CH.c,{body:JSON.stringify({chat:CI,k:CH.k,id:id,d:d})}).then(function(x){FR=x.rel;
    return new Promise(function(ok,mal){var n=0,sinLat=0;(function mira(){n++;
      fetch(FR+'/'+CH.r+'/json?poll=1&since='+t0).then(function(r){return r.text()}).then(function(tx){var hallado=null;
        tx.split('\n').forEach(function(l){try{var e=JSON.parse(l);if(e.event!=='message')return;
          if(e.title===id&&e.attachment)hallado=fetch(e.attachment.url).then(function(r){return r.json()});
          else{var m=JSON.parse(e.message);if(m.id===id)hallado=Promise.resolve(m)}}catch(x){}});
        if(hallado)return hallado.then(function(m){if(m&&m.vieja){FIN.mostrar(m);return}ok(m)},mal);
        if((n===3||n===5||(n>5&&n%5===0))&&CH.l&&FR.indexOf('ntfy.sh')<0){   // 💓 ¿la PC está viva? si dejó de latir, se avisa YA (no se espera 3 min)
          return fetch(FR+'/'+CH.l+'/json?poll=1&since='+(n<10?'180s':'100s')).then(function(r){return r.ok?r.text():'?'}).then(function(t){
            if(t!=='?'&&!/"event":"message"/.test(t)&&++sinLat>=2){var xq=new Error('La PC del monitoreo no está funcionando ahora (apagada, sin internet o el programa cerrado). Avise al administrador.');xq.pc=true;return mal(xq)}
            setTimeout(mira,2000)}).catch(function(){setTimeout(mira,2000)})}
        if(n>(d.accion==='texto'||d.accion==='cb'||d.accion==='mas'?40:32))return mal(new Error('La PC no respondió (¿está prendida?)'));setTimeout(mira,n<6?2000:n<15?4000:6000)})
      .catch(function(){if(n>40)return mal(new Error('Sin internet'));setTimeout(mira,2500)})})()})})}

function hacer(d){   // acciones del panel: con canal, se queda en la app y muestra el resultado
  if(!D.ch)return alBot(d);
  var t0=Date.now();pantalla({e:'<span class="girar">⏳</span>',h1:'Enviando…',p:'Su PC lo está haciendo.<br><span id="reloj" style="font-size:22px;font-weight:800">⏱️ 0:00</span><br><span id="relojTxt">Normalmente tarda menos de 30 segundos.</span>'});

function lee(cb){var m=location.search.match(/[?&]z=([^&]+)/);if(!m)return cb(null);cargarZ(m[1],cb)}
function cargarZ(z,cb){
  var t=z.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';
  var b=atob(t),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
  if(!window.DecompressionStream)return cb(null,'Actualice Telegram o el teléfono para abrir el panel.');
  new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate'))).text().then(function(s){cb(JSON.parse(s))}).catch(function(){cb(null)})}
function estadoEsc(x){var mal=x.e==='F'||x.ls==='cer'||x.ls==='no'||x.p.indexOf('m')>=0||!!x.ip,am=x.ls==='nov'||x.cm||x.p.indexOf('f')>=0;return mal?'r':!x.ls?'n':am?'a':''}

  var i=x.p.indexOf('m');if(i>=0&&x.pd)n.push('prueba '+(i+1)+': '+esc(x.pd[i][2]||'con problema'));
  else{i=x.p.indexOf('f');if(i>=0&&x.pd&&x.pd[i][1])n.push('prueba '+(i+1)+' atrasada '+esc(x.pd[i][1]))}
