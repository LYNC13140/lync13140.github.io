<style>
:root{--fondo:#fff8ec;--azul:#123a6b;--txt:#1b2333;--mut:#5a6577;--verde:#2e9e5b;--rojo:#d64545;--ambar:#e39a19;--celeste:#2f80ed;--gris:#e2d6c0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--fondo);color:var(--txt);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
#app{min-height:100vh;display:flex;flex-direction:column;padding:0 0 calc(16px + env(safe-area-inset-bottom))}
.top{background:var(--azul);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:10px}
.top .atras{font-size:26px;background:none;border:0;color:#fff;padding:0 6px 0 0}
.top b{font-size:18px;line-height:1.2;display:block}.top small{font-size:13px;opacity:.85}
.prog{display:flex;gap:5px;padding:14px 16px 2px}.prog i{flex:1;height:11px;border-radius:6px;background:#d9dee6}.prog i.on{background:var(--verde)}
.paso{font-size:15px;font-weight:700;color:var(--azul);padding:4px 16px 0}
.q{text-align:center;padding:14px 18px 6px}
.q .e{font-size:92px;line-height:1.1}
.q h1{font-size:29px;line-height:1.15;color:var(--azul);margin:10px 0 6px}
.q p{font-size:18px;color:var(--mut);margin:0;line-height:1.35}
.ops{padding:6px 16px 0}
.op{display:block;width:100%;border:0;border-radius:22px;padding:22px 14px;margin:0 0 14px;color:#fff;font-size:24px;font-weight:800;line-height:1.2;
  box-shadow:0 6px 0 rgba(0,0,0,.2);text-align:center;font-family:inherit}
.op:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.op.g{background:var(--verde)}.op.r{background:var(--rojo)}.op.a{background:var(--ambar)}.op.b{background:var(--celeste)}.op.n{background:#5b6b82}
.op.chico{font-size:19px;padding:15px 12px}
.estado{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:12px 16px 0}
.chip{background:#fff;border:3px solid var(--gris);border-radius:16px;padding:8px 12px;font-size:17px;font-weight:700}
.chip.ok{border-color:#9fd8b6;background:#eaf8ef}.chip.mal{border-color:#f0b0b0;background:#fdeeee}
.aviso{margin:12px 16px 0;padding:14px;border-radius:18px;background:#fff3cd;border:3px dashed #e0b84a;font-size:18px;line-height:1.35;text-align:center}
.aviso.mal{background:#fdeeee;border-color:#e88}
.grande{font-size:44px;font-weight:900;color:var(--azul);text-align:center;margin:4px 0}
.cam{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;z-index:9}
.cam video,.cam img{flex:1;width:100%;object-fit:contain;min-height:0}
.cam .barra{display:flex;gap:12px;justify-content:center;align-items:center;padding:16px 16px calc(18px + env(safe-area-inset-bottom));background:#000}
.disparo{width:92px;height:92px;border-radius:50%;border:8px solid #fff;background:#ffffff33}
.disparo:active{background:#ffffffaa}
.cam .op{margin:0;flex:1}
.cam .tit{color:#fff;text-align:center;font-size:20px;font-weight:700;padding:calc(12px + env(safe-area-inset-top)) 12px 8px}
.girar{display:inline-block;animation:g 1.2s linear infinite}@keyframes g{to{transform:rotate(360deg)}}
.oculto{display:none!important}
.sup{font-size:22px;text-align:center;line-height:1.5;padding:10px 16px}.sup a{color:var(--celeste);font-weight:800;font-size:28px;text-decoration:none}
</style>
<style id="tema2026">
/* ✨ TEMA 2026 «futurista» para las Mini Apps de Telegram — SOLO aspecto. No cambia nada de cómo funciona. */
:root{--fondo:#050a17;--azul:#8fd8ff;--txt:#e9f1ff;--mut:#9fb3d6;--gris:rgba(120,170,255,.22);

.op{border:1px solid rgba(255,255,255,.14)!important;box-shadow:0 10px 24px -12px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.22)!important;text-shadow:0 1px 2px rgba(0,0,0,.35);
 transition:transform .12s ease,box-shadow .2s ease,filter .2s;position:relative;overflow:hidden}
.op::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.16),transparent 45%);pointer-events:none}

.op.g{background:linear-gradient(135deg,#16a34a,#22c55e 55%,#2dd4bf)!important;box-shadow:0 12px 28px -12px rgba(34,197,94,.75),inset 0 1px 0 rgba(255,255,255,.25)!important}
.op.r{background:linear-gradient(135deg,#be123c,#f43f5e 60%,#fb7185)!important;box-shadow:0 12px 28px -12px rgba(244,63,94,.75),inset 0 1px 0 rgba(255,255,255,.25)!important}

.op.b{background:linear-gradient(135deg,#6d5dfc,#3b82f6 55%,#22d3ee)!important;box-shadow:0 12px 28px -12px rgba(59,130,246,.85),inset 0 1px 0 rgba(255,255,255,.25)!important}
.op.n{background:linear-gradient(135deg,#334766,#46608a)!important}
.op:disabled,.op[disabled]{opacity:.5;filter:grayscale(.4)}
.badge{background:#fff!important;color:#e11d48!important;box-shadow:0 0 14px -2px rgba(255,255,255,.7)}
/* tarjetas y chips de vidrio */
.chip,.k,.esc,.it,.fil button,.seg button{background:var(--g-glass)!important;border-color:var(--g-line2)!important;color:var(--txt)!important;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.chip.ok,.k.v{background:linear-gradient(160deg,rgba(34,197,94,.20),rgba(17,29,54,.78))!important;border-color:rgba(34,197,94,.55)!important}
.chip.mal,.k.r{background:linear-gradient(160deg,rgba(244,63,94,.20),rgba(17,29,54,.78))!important;border-color:rgba(244,63,94,.55)!important}
.k.a{background:linear-gradient(160deg,rgba(245,158,11,.20),rgba(17,29,54,.78))!important;border-color:rgba(245,158,11,.55)!important}
.k{border-width:1px!important;box-shadow:0 10px 26px -14px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.05);transition:transform .15s,box-shadow .2s,border-color .2s}
.k:active{transform:scale(.97)!important;box-shadow:var(--g-glow);border-color:rgba(34,211,238,.7)!important}
.k b{color:#f3f8ff}.k.v b,.ok b{color:#4ade80!important}.k.r b,.bad b{color:#fb7185!important}.k.a b,.warn b{color:#fbbf24!important}
.k span,.k small{color:#a9bde0!important}
.esc{box-shadow:0 8px 22px -14px rgba(0,0,0,.9)!important;transition:transform .12s,box-shadow .2s}
.esc:active{transform:scale(.98);box-shadow:var(--g-glow)!important}
.esc b{color:#bfe6ff!important}.esc .m{color:var(--mut)!important}
.esc.r{border-left-color:#f43f5e!important}.esc.a{border-left-color:#f59e0b!important}.esc:not(.r):not(.a):not(.n){border-left-color:#22c55e!important}
.fil button,.seg button{transition:all .15s}
.fil .on,.seg .on{background:linear-gradient(135deg,rgba(59,130,246,.55),rgba(34,211,238,.35))!important;border-color:rgba(34,211,238,.7)!important;color:#fff!important;box-shadow:var(--g-glow)}
.lin small{color:var(--mut)!important}
/* avisos */
.aviso,.av{background:linear-gradient(160deg,rgba(245,158,11,.16),rgba(17,29,54,.8))!important;border:1px solid rgba(245,158,11,.55)!important;color:#fde7b0}
.aviso.mal,.av:not(.am):not(.ok){background:linear-gradient(160deg,rgba(244,63,94,.17),rgba(17,29,54,.8))!important;border-color:rgba(244,63,94,.55)!important;color:#ffd5dc}
.av.ok{background:linear-gradient(160deg,rgba(34,197,94,.16),rgba(17,29,54,.8))!important;border-color:rgba(34,197,94,.55)!important;color:#c9f7d8}
.sup a{color:#7dd3fc!important;text-shadow:0 0 16px rgba(34,211,238,.45)}
/* colores puestos dentro del texto: los pasamos a versión que se lea en oscuro */

[style*="color:#b45309"],[style*="color:#b87700"]{color:#fbbf24!important}
[style*="color:#1a7f37"]{color:#4ade80!important}
[style*="color:#1f6feb"]{color:#7dd3fc!important}

<style id="ios-tema">
/* iOS 17/18 · «Cobalto» — SOLO aspecto (CSS). No toca ids, clases que usa el JS, textos ni lógica.

:root{
 --i-font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;

 --i-ok:#0b7a3d;--i-bad:#c01f3a;--i-warn:#8f5206;
 --i-okbg:rgba(22,163,74,.13);--i-badbg:rgba(225,29,72,.10);--i-warnbg:rgba(217,119,6,.14);
 --i-okln:rgba(22,163,74,.38);--i-badln:rgba(225,29,72,.34);--i-warnln:rgba(217,119,6,.42);
 --i-sh:0 1px 2px rgba(15,25,60,.06),0 12px 26px -14px rgba(15,25,60,.28);
 --i-aurora1:rgba(10,110,255,.16);--i-aurora2:rgba(6,182,212,.14);
 --ch-b:linear-gradient(145deg,#eaf3ff,#bcd8ff);--ch-r:linear-gradient(145deg,#ffe9ee,#ffb9c7);
 --ch-g:linear-gradient(145deg,#e6fbef,#a9ecc6);--ch-a:linear-gradient(145deg,#fff4dc,#ffd78a);--ch-v:linear-gradient(145deg,#f1eaff,#cdb8ff);
 --i-chsh:inset 0 1px 0 rgba(255,255,255,.9),0 6px 14px -8px rgba(15,25,60,.35);
 /* se reasignan los nombres de los temas viejos para que sus reglas hereden esta paleta */
 --txt:var(--i-tx);--mut:var(--i-mu);--tx:var(--i-tx);--mu:var(--i-mu);--g-glass:var(--i-card);--g-line:var(--i-line);--g-line2:var(--i-line);
 --card:var(--i-card);--line:var(--i-line);--bg:var(--i-bg);--fondo:var(--i-bg);--azul:var(--i-tx);--gris:var(--i-line);
 --ok:var(--i-ok);--bad:var(--i-bad);--warn:var(--i-warn);--verde:#0e9150;--rojo:#d4254a;--ambar:#f5a30b;--celeste:#2563eb;
 --g-glow:0 0 0 2px var(--i-ring),0 10px 26px -10px rgba(6,182,212,.55)}
@media (prefers-color-scheme:dark){:root{
 --i-bg:#070b16;--i-card:#111829;--i-card2:#182138;--i-line:rgba(255,255,255,.10);--i-tx:#f4f7ff;--i-mu:#a5b1cb;
 --i-seg:rgba(130,150,200,.20);--i-seg-on:#2c3860;--i-inp:#0b1222;--i-link:#78b8ff;
 --i-bar:rgba(8,12,24,.78);--i-bar-solid:#0a0f1d;
 --i-ok:#4ade80;--i-bad:#ff8097;--i-warn:#fbbf24;

 --i-sh:0 1px 0 rgba(255,255,255,.04) inset,0 14px 28px -16px rgba(0,0,0,.85);
 --i-aurora1:rgba(30,110,255,.30);--i-aurora2:rgba(6,182,212,.20);
 --ch-b:linear-gradient(145deg,#22407a,#12234a);--ch-r:linear-gradient(145deg,#5a1a2b,#2e0e18);
 --ch-g:linear-gradient(145deg,#14502f,#0b2a19);--ch-a:linear-gradient(145deg,#5d4108,#2f2104);--ch-v:linear-gradient(145deg,#3f2a78,#1f1440);
 --i-chsh:inset 0 1px 0 rgba(255,255,255,.18),0 6px 14px -8px rgba(0,0,0,.8);

/* ---------- base ---------- */
html{background:var(--i-bg)!important;-webkit-text-size-adjust:100%;text-size-adjust:100%}
:root body{font-family:var(--i-font)!important;color:var(--i-tx)!important;background:transparent!important;background-attachment:scroll!important;
 -webkit-font-smoothing:antialiased;overflow-x:clip;line-height:1.35}
:root body.bienvF{background:transparent!important}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:340px;z-index:-1;pointer-events:none;
 background:radial-gradient(70% 100% at 10% 0%,var(--i-aurora1),transparent 70%),radial-gradient(55% 90% at 95% 0%,var(--i-aurora2),transparent 70%)}
:root h1,:root h2,:root h3,:root .top b,:root .grande,:root .k b{font-family:var(--i-font)!important;letter-spacing:-.02em}
:root h1,:root h2,:root h3{text-shadow:none!important}
:root .q h1,:root .top h1,:root h2{color:var(--i-tx)!important;font-weight:800}
:root .q h1{font-size:clamp(26px,7.6vw,32px);line-height:1.12;letter-spacing:-.03em;text-wrap:balance}
:root .q p,:root .nota,:root .mu{color:var(--i-mu)!important}
:root .q p{line-height:1.4}
:root h3{color:var(--i-tx)!important;font-size:20px;font-weight:700;margin-top:20px}
:root h2{font-size:26px;letter-spacing:-.025em}
:root .k b,:root .grande,:root .badge,:root .paso,:root .top small,:root .av b,:root .esc .s,:root .lin,:root .pill,:root .vivo{font-variant-numeric:tabular-nums}
:root .grande{color:var(--i-tx)!important;text-shadow:none!important;font-weight:800;letter-spacing:-.03em}
::selection{background:rgba(6,182,212,.30)}
:focus-visible{outline:3px solid var(--i-ring);outline-offset:2px}

/* ---------- barra superior de vidrio (solo la barra fija; sin blur en el resto) ---------- */
:root .top{position:sticky;top:0;z-index:20;margin-inline:calc(50% - 50vw);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
 background:var(--i-bar-solid)!important;border:0!important;border-image:none!important;box-shadow:0 .5px 0 var(--i-line)!important;color:var(--i-tx)}
@supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
 :root .top{background:var(--i-bar)!important;-webkit-backdrop-filter:saturate(1.7) blur(18px);backdrop-filter:saturate(1.7) blur(18px)}}
:root .top b{color:var(--i-tx)!important;font-size:17px;font-weight:700}
:root .top small,:root .top .mu{color:var(--i-mu)!important;opacity:1}
:root .top h1{font-size:26px;line-height:1.1;margin:2px 0 4px;letter-spacing:-.03em;text-shadow:none}
:root .top .mu{font-size:13px;line-height:1.35}
:root .top .atras,:root .back{color:var(--i-link)!important;font-weight:600}
:root .top .atras{flex:0 0 auto;width:44px;height:44px;padding:0;border-radius:50%;display:inline-grid;place-items:center;font-size:22px;background:var(--i-seg)!important}
:root .back{min-height:44px;font-size:17px;padding:0 4px 0 0}
:root .paso{color:var(--i-mu);font-size:14px;font-weight:600}
:root .modo{background:var(--i-warnbg)!important;border:1px solid var(--i-warnln)!important;color:var(--i-tx);border-radius:999px;padding:7px 14px}

/* ---------- avance por pasos ---------- */
:root .prog i{height:6px;border-radius:3px;background:var(--i-seg)!important}

    navigator.geolocation.getCurrentPosition(bien,function(e){if(e.code===1)return mal(new Error('permiso'));
      navigator.geolocation.getCurrentPosition(bien,function(e2){mal(new Error(e2.code===1?'permiso':'No se pudo saber dónde está. Encienda el GPS.'))},{enableHighAccuracy:false,timeout:15000,maximumAge:60000})},

var TR=null;
function hoyS(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function trClave(){return 'mon_viaje_'+(E&&E.codigo)}
function trCargar(){try{var x=JSON.parse(localStorage.getItem(trClave())||'null');if(x&&x.dia===hoyS())return x}catch(e){}return null}
function trGuardar(){try{if(TR)localStorage.setItem(trClave(),JSON.stringify(TR))}catch(e){}}
function trBorrar(){try{localStorage.removeItem(trClave())}catch(e){}}
function destC(){if(TR&&TR.dest==='cpe'&&E.cpe)return E.cpe?[E.cpe[0],E.cpe[1],E.cpe[2]||300]:null;return E.co?[E.co[0],E.co[1],E.lim||300]:null}
function destNom(){return TR&&TR.dest==='cpe'?'el CPE':'su recinto'}
function horaDe(ms){var d=new Date(ms);return pad(d.getHours())+':'+pad(d.getMinutes())}
function minutos(){return TR?Math.round((Date.now()-TR.ini)/60000):0}
function explicar(u,d){   // por qué no lo deja: compara con cómo va el viaje
  var l=[],c=destC();if(d==null&&c)d=metros(c[0],c[1],u.lat,u.lon);
  if(u&&u.acc>100)l.push('📶 Su GPS está <b>débil</b> (±'+Math.round(u.acc)+' m): salga a un lugar abierto, espere 1 minuto y pruebe otra vez.');
  if(TR&&TR.pts&&TR.pts.length){var p0=TR.pts[0],mov=metros(p0[1],p0[2],u.lat,u.lon),m=minutos();
    if(m>=5&&mov<200)l.push('🤔 <b>No se ha movido'+(mov<15?' ni un metro':'')+'</b> desde que inició el viaje a las '+horaDe(TR.ini)+' (hace '+m+' min; sigue a '+Math.round(mov)+' m de donde salió).');
    else l.push('🚗 Salió hace <b>'+m+' min</b> y ha recorrido <b>'+km((TR.km||0)*1000)+'</b>.');
    if(TR.min!=null&&d!=null&&d>TR.min+500)l.push('↩️ <b>Se está alejando</b>: llegó a estar a '+km(TR.min)+' y ahora está a '+km(d)+'.')}
  if(d!=null)l.push('📍 Le faltan <b>'+km(d)+'</b> para '+destNom()+'.');
  return l.join('<br>')}
function viajeBot(dest){
  if(dest){TR={dia:hoyS(),dest:dest,ini:Date.now(),pts:[],km:0,min:null,cerca:0};trGuardar()}else TR=TR||trCargar();
  if(!TR)return home();
  pararViaje();F={tipo:'viaje'};
  pantalla({titulo:'En camino',e:'<span class="girar">📍</span>',h1:'Buscando dónde está…',p:'Si el teléfono pregunta, toque <b>Permitir</b>.'});
  puntoViaje(true);reloj=setInterval(function(){puntoViaje(false)},30000)}
var WATCH=null;
function seguirGPS(){if(WATCH!=null||!navigator.geolocation)return;
  try{WATCH=navigator.geolocation.watchPosition(function(p){ULT={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy,ts:Date.now()}},function(){},{enableHighAccuracy:true,maximumAge:15000,timeout:60000})}catch(e){}}
function soltarGPS(){try{if(WATCH!=null)navigator.geolocation.clearWatch(WATCH)}catch(e){}WATCH=null}
function puntoViaje(primero){seguirGPS();(primero?ubicacion():ubicacion(false)).then(function(u){
    var now=Date.now(),p=TR.pts,ult=p[p.length-1];
    if(!ult||metros(ult[1],ult[2],u.lat,u.lon)>=40||now/1000-ult[0]>=120){
      if(ult&&u.acc<150)TR.km=(TR.km||0)+metros(ult[1],ult[2],u.lat,u.lon)/1000;
      p.push([Math.round(now/1000),+u.lat.toFixed(6),+u.lon.toFixed(6)]);if(p.length>150)p.splice(1,1)}
    var c=destC(),d=c?metros(c[0],c[1],u.lat,u.lon):null,m=minutos(),msg,mal=false;
    if(!TR.anc||metros(TR.anc[1],TR.anc[2],u.lat,u.lon)>Math.max(40,Math.min(u.acc||0,100)))TR.anc=[now,u.lat,u.lon];
    var quieto=Math.round((now-TR.anc[0])/60000),mov=Math.round(metros(TR.anc[1],TR.anc[2],u.lat,u.lon));
    if(u.acc>150){msg='📶 Su GPS está <b>débil</b> (±'+Math.round(u.acc)+' m). Salga a un lugar abierto.';mal=true}
    else if(d!=null&&TR.min!=null&&d>TR.min+500){msg='↩️ <b>Se está alejando</b> de '+destNom()+': estuvo a '+km(TR.min)+', ahora a '+km(d)+'. Revise la ruta.';mal=true}
    else if(quieto>=5){msg='🤔 <b>No se ha movido'+(mov<15?' ni un metro':'')+'</b> en <b>'+quieto+' min</b> (desde las '+horaDe(TR.anc[0])+'). ¿Pasa algo? Si tiene un problema, toque <b>⚠️ PROBLEMA EN EL CAMINO</b>.';mal=true;vibra('mal')}
    else msg='✅ <b>Va bien</b> · '+m+' min'+((TR.km||0)>=0.1?' · lleva '+km(TR.km*1000):'');
    if(d!=null&&u.acc<150)TR.min=TR.min==null?d:Math.min(TR.min,d);
    TR.u=u;TR.d=d;trGuardar();
    if(d!=null&&d-Math.min(u.acc||0,50)<=c[2]){pararViaje();vibra('ok');
      if(TR.dest==='cpe'&&!E.capacitacion){TR.enCpe=1;trGuardar();return pantalla({e:'🏢🎉',h1:'¡Llegó al CPE!',p:'Cuando salga hacia su recinto, toque el botón.',ops:[['🚗 YA SALGO A MI RECINTO','g',function(){viajeBot('recinto')}]]})}
      TR.llego=1;trGuardar();pantalla({e:'🎉',h1:'¡Llegó!',p:'Ahora unas preguntas rápidas.'});return setTimeout(function(){llegada(u)},1500)}
    if(d!=null&&d<=2000&&!TR.cerca&&TR.dest!=='cpe'){TR.cerca=1;trGuardar();vibra();return cerca(u,d)}
    if(!F.problema)pantallaViaje(d,msg,mal)
  }).catch(function(e){if(primero)return sinUbicacion(e,function(){viajeBot()});if(!F.problema)pantallaViaje(TR.d,'📶 No se pudo leer el GPS ahora. Seguimos intentando.',true)})}

    ,aviso:msg,avisoMal:mal,ops:[['🏁 YA LLEGUÉ','g',yaLlegue],['⚠️ PROBLEMA EN EL CAMINO','a',camino],['⛔ NO PUEDO LLEGAR','r',function(){noLlego(TR&&TR.u)}],['📞 MI SUPERVISOR','n',supervisor,1]]})}

        .concat(E.demo?[['🧪 SEGUIR IGUAL (solo en prueba)','n',function(){TR.llego=1;trGuardar();F={tipo:'llegada',check:{}};F.u={lat:u.lat,lon:u.lon,acc:u.acc};F.dist=d;pregunta(0)},1]]:[])})

function revFibra(){pantalla({atras:revCnt,paso:[7,NPASO],titulo:'Revisión de equipos',e:'🧵🔎',h1:'¿Cómo están las luces de la FIBRA?',p:'Mire en el equipo de CNT las luces <b>PON</b> y <b>LOS</b>.',extra:ontSvg('PON'),

function ips(){pantalla({atras:armar,paso:[9,NPASO],titulo:'Revisión de equipos',e:'💻🌐',h1:'Vea la COMPUTADORA: ¿tiene las 2 IP?',p:'Revise en la computadora si tiene las <b>2 direcciones IP</b>.',

function sinIp(){var m=motivoRevision();if(m){F.ip_mot=m;return fotoIps()}pantalla({atras:ips,paso:[9,NPASO],e:'🔎📶',h1:'¿Por qué no tiene '+(F.ips==='1'?'las 2 IP':'IP')+'?',p:'Escoja lo que ve. Se reporta como <b>incidencia</b>.',

  .catch(function(e){error(e.message,mandarPrueba)})}

// ------------------------------------------------------------------ 📷 cámara (en vivo; si no, la del teléfono)
var stream=null,blob=null,camCfg=null;
function camara(parte,titulo,luego){
  // 🧪 MODO PRUEBAS: la cámara se abre igual y se toma la foto, pero NO se envía (pasa al siguiente paso)
  camCfg={parte:parte,titulo:titulo,luego:luego,sim:!!(E&&E.fs)};blob=null;
  $('camTit').textContent=(camCfg.sim?'🧪 PRUEBA (la foto NO se envía) · ':'📷 ')+titulo;$('cam').classList.remove('oculto');$('prev').classList.add('oculto');$('vid').classList.remove('oculto');
  $('bTomar').classList.remove('oculto');$('bRev').classList.add('oculto');
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return camaraTelefono();
  navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}})
   .then(function(s){stream=s;$('vid').srcObject=s;var p=$('vid').play();if(p&&p.catch)p.catch(function(){})})
   .catch(function(){navigator.mediaDevices.getUserMedia({video:true}).then(function(s){stream=s;$('vid').srcObject=s}).catch(camaraTelefono)})}
function cerrarCam(){if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}$('cam').classList.add('oculto')}
function camaraTelefono(){cerrarCam();$('archivo').value='';$('archivo').click()}
$('archivo').onchange=function(e){var f=e.target.files&&e.target.files[0];if(!f)return;
  if(Date.now()-(f.lastModified||Date.now())>5*60*1000){return error('Esa foto es vieja (de la galería). Tome una foto NUEVA.',function(){camara(camCfg.parte,camCfg.titulo,camCfg.luego)})}
  var img=new Image();img.onload=function(){$('cam').classList.remove('oculto');procesar(img,img.naturalWidth,img.naturalHeight)};img.src=URL.createObjectURL(f)};
function marca(ctx,w,h){var l=['CNE · MONITOREO TÉCNICO 2027 · foto en el sitio',E.codigo+' · '+E.escuela,camCfg.titulo+' · '+ahora(),E.quien+(F.dist!=null?' · a '+F.dist+' m':'')];
  var fs=Math.max(16,Math.round(w/50)),alto=fs*1.35*l.length+fs;ctx.fillStyle='rgba(0,0,0,0.62)';ctx.fillRect(0,h-alto,w,alto);
  ctx.fillStyle='#fff';ctx.font='bold '+fs+'px Arial, sans-serif';ctx.textBaseline='top';
  l.forEach(function(t,i){while(ctx.measureText(t).width>w-fs&&t.length>8)t=t.slice(0,-2);ctx.fillText(t,fs/2,h-alto+fs/2+i*fs*1.35)})}
function procesar(src,sw,sh){var k=Math.min(1,1280/Math.max(sw,sh)),w=Math.round(sw*k),h=Math.round(sh*k),cv=$('cv');cv.width=w;cv.height=h;
  var ctx=cv.getContext('2d');ctx.drawImage(src,0,0,w,h);marca(ctx,w,h);
  cv.toBlob(function(b){blob=b;$('prev').src=URL.createObjectURL(b);$('prev').classList.remove('oculto');$('vid').classList.add('oculto');
    $('bTomar').classList.add('oculto');$('bRev').classList.remove('oculto')},'image/jpeg',0.78)}
$('disparo').onclick=function(){var v=$('vid');if(!v.videoWidth)return;vibra();procesar(v,v.videoWidth,v.videoHeight)};
$('repetir').onclick=function(){vibra();if(stream){$('prev').classList.add('oculto');$('vid').classList.remove('oculto');$('bTomar').classList.remove('oculto');$('bRev').classList.add('oculto')}else camaraTelefono()};
$('camCancel').onclick=function(){cerrarCam()};
function subirRelay(parte,b){   // la foto pasa por un servidor gratis de paso (se borra sola en 3 h); la PC la baja y la borra
  return postRelay(E.ff||E.fr,E.ft,{method:'PUT',headers:{'Filename':parte+'.jpg','Title':E.codigo+' '+parte},body:b,ms:35000,alt:E.ff?E.ffs:ALT})
    .then(function(x){var r=x.r;
      return r.json().then(function(j){if(!r.ok||!j.attachment||!j.attachment.url)throw new Error(j.error||'No se pudo subir');
      F.fotos=F.fotos||{};F.fotos[parte]=j.attachment.url+'#'+j.id;return j})})
    .catch(function(e){if(e.lleno){LLENO=true;throw e}throw new Error('No se pudo enviar la foto (revise el internet). Toque «Usar foto» otra vez.')})}
$('usar').onclick=function(){if(!blob)return;var b=$('usar');b.disabled=true;b.textContent='Enviando…';
  var listo=function(){b.disabled=false;b.textContent='✅ Usar foto';cerrarCam();vibra('ok');camCfg.luego()};
  if(camCfg.sim){F.fsim=F.fsim||[];if(F.fsim.indexOf(camCfg.parte)<0)F.fsim.push(camCfg.parte);aviso1('🧪 Modo pruebas: la foto NO se envió (se practicó el paso)');blob=null;return listo()}
  var guardar=function(){return fotoSinSenal(camCfg.parte,blob).then(function(){aviso1('📦 Sin señal: la foto quedó guardada en el teléfono');listo()})};
  if(BOT&&RELAY&&(F.pend||navigator.onLine===false))return guardar();      // 📦 sin señal: la foto se guarda y se manda después
  (BOT?subirRelay(camCfg.parte,blob):api('/tg/app/foto?parte='+camCfg.parte,blob,'image/jpeg')).then(listo)
   .catch(function(e){if(e.lleno){aviso1('📷 Mucha gente a la vez: el bot le pedirá esta foto por el chat');return listo()}
     if(BOT&&RELAY)return guardar();b.disabled=false;b.textContent='✅ Usar foto';cerrarCam();error(e.message,function(){camara(camCfg.parte,camCfg.titulo,camCfg.luego)})})};

window.__app={inicio:inicio,home:home,llegada:llegada,prueba:prueba,viaje:viaje,colaLeer:colaLeer,enviarCola:enviarCola};
inicio();
if(BOT){setTimeout(function(){enviarCola()},2500);
  try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}}
})();
